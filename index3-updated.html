<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b3d91">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>IPSPS PORTAL - IPS PUBLIC SCHOOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
html{scroll-behavior:smooth}
body{background:radial-gradient(circle at 10% 10%,rgba(48,108,200,.07),transparent 28%),#f1f5fa;color:#163660;overflow-x:hidden}
.hero-image{width:100%;margin:0;padding:0;line-height:0;overflow:hidden;background:#edf2f7}
.hero-image img{display:block;width:100%;height:auto;max-width:none;object-fit:contain;object-position:center;filter:brightness(1.04) saturate(.96) contrast(.98)}
/* Full-width black announcement strip directly below students' image */
.notice-section{width:100%;margin:0;padding:0;background:#000;color:#fff;overflow:hidden;border:0;border-radius:0;box-shadow:none}
.notice-inner{width:100%;padding:0;margin:0;background:#000;border:0;border-radius:0}
.notice-inner marquee{display:block;width:100%;min-height:54px;padding:13px 10px;background:#000;color:#fff;border:0;border-radius:0;font-size:21px;line-height:1.25;font-weight:900;letter-spacing:.3px;white-space:nowrap;text-shadow:0 1px 2px #555}
#countdown{display:none!important;margin:0!important;padding:0!important;text-align:center;color:#fff;font-size:11px!important;font-weight:800}
.main-container{width:100%;margin:0;padding:0}
.school-card{position:relative;width:100%;padding:18px 12px 25px;background:linear-gradient(145deg,#fff 0%,#f7faff 50%,#edf4fc 100%);border-bottom:1px solid #d9e3ef;box-shadow:0 16px 40px rgba(16,50,90,.10),inset 0 1px 0 #fff;overflow:hidden}
.school-card:before{content:"";position:absolute;width:300px;height:300px;right:-190px;top:-190px;border-radius:50%;background:radial-gradient(circle,rgba(60,120,210,.07),transparent 68%);pointer-events:none}
.school-card:after{content:"";position:absolute;width:240px;height:240px;left:-170px;bottom:-170px;border-radius:50%;background:radial-gradient(circle,rgba(210,173,52,.07),transparent 70%);pointer-events:none}
.luxury-line{position:relative;z-index:2;width:92px;height:3px;margin:0 auto 10px;border-radius:20px;background:linear-gradient(90deg,#a97b16,#f0d36c,#b4861e)}
.logo{position:relative;z-index:2;width:84px;height:84px;margin:0 auto 8px;padding:6px;border-radius:50%;background:#fff;border:3px solid #d5af39;box-shadow:0 0 0 6px rgba(213,175,57,.07),0 10px 25px rgba(20,54,96,.16)}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.school-name{position:relative;z-index:2;width:100%;text-align:center;white-space:nowrap;color:#0b3d91;font-size:clamp(32px,6.5vw,58px);line-height:1;font-weight:900;letter-spacing:.5px;text-shadow:0 3px 9px rgba(11,61,145,.10)}
.school-place{position:relative;z-index:2;margin-top:6px;text-align:center;color:#9b7418;font-size:12px;font-weight:900;letter-spacing:3px}
.result-panel{position:relative;z-index:3;width:min(940px,94%);margin:10px auto 0;padding:23px 26px 28px;border-radius:26px;background:linear-gradient(145deg,#fff 0%,#f7faff 50%,#edf4fc 100%);border:1px solid #d4e0ed;box-shadow:0 18px 42px rgba(17,52,91,.12),inset 0 1px 0 #fff;overflow:hidden}
.result-panel:before{content:"";position:absolute;width:210px;height:210px;right:-120px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(210,174,53,.08),transparent 68%);pointer-events:none}
.result-heading-line{position:relative;z-index:2;width:75px;height:4px;margin:0 auto 9px;border-radius:20px;background:linear-gradient(90deg,#a97c17,#efd36a,#b4861e)}
#examTitle{position:relative;z-index:2;margin:0!important;text-align:center;color:#b45309!important;font-size:clamp(22px,4.5vw,32px)!important;line-height:1.15;font-weight:900!important;letter-spacing:.3px;text-shadow:0 2px 5px rgba(180,83,9,.12)!important}
#sessionTitle{position:relative;z-index:2;margin:4px 0 0!important;text-align:center;color:#9b7418!important;font-size:13px;font-weight:800}
.live{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:7px;width:max-content;margin:9px auto 21px;padding:8px 20px;border-radius:50px;color:#fff;background:linear-gradient(180deg,#39cc95,#10875d);border:1px solid #91e5c4;font-size:10px;font-weight:900;box-shadow:0 7px 18px rgba(16,135,93,.22),inset 0 1px 1px rgba(255,255,255,.45)}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.15)}
.result-form{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:0}
.field{position:relative;padding:0;border:2px solid #c99b2e;border-radius:17px;background:linear-gradient(145deg,#fff,#f7f9fc);box-shadow:0 8px 20px rgba(20,50,90,.08),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden}
.field:before{content:"";position:absolute;inset:0;border-radius:15px;border:1px solid rgba(255,221,112,.75);pointer-events:none;z-index:3}
.field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#a97915,#f3d46b,#b17f18,#f3d46b,#a97915);pointer-events:none;z-index:4}
.field label{display:none}
.result-input{position:relative;z-index:2;width:100%;height:62px;padding:0 19px;border:0;outline:0;border-radius:14px;background:linear-gradient(145deg,#fff,#f5f8fc);color:#193b6d;font-size:14px;font-weight:600;box-shadow:none;transition:.25s}
.result-input:focus{border:0;outline:0;box-shadow:inset 0 0 0 2px rgba(37,99,235,.12)}
select.result-input{appearance:auto;cursor:pointer}
.view-result-btn{position:relative;z-index:2;width:100%;height:65px;margin-top:22px;border:1px solid #7ea7d8;border-radius:15px;cursor:pointer;color:#fff;font-size:15px;font-weight:900;letter-spacing:1.6px;background:linear-gradient(180deg,#5a9bea 0%,#286dc1 48%,#0b3d91 100%);box-shadow:0 7px 0 #062d68,0 18px 34px rgba(11,61,145,.28),inset 0 2px 2px rgba(255,255,255,.42);transition:.15s;overflow:hidden}
.view-result-btn:before{content:"";position:absolute;top:5px;left:9%;right:9%;height:1px;background:rgba(255,255,255,.5)}
.view-result-btn:after{content:"";position:absolute;top:0;left:-80%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);transition:.7s}
.view-result-btn:hover:after{left:130%}
.view-result-btn:hover{transform:translateY(-3px);box-shadow:0 10px 0 #062d68,0 23px 40px rgba(11,61,145,.34),inset 0 2px 2px rgba(255,255,255,.45)}
.view-result-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #062d68,0 8px 15px rgba(11,61,145,.20)}
#result:empty{display:none}
.result-card{width:min(940px,94%);margin:18px auto;padding:26px;border-radius:25px;background:#fff;border:1px solid #dce6f2;box-shadow:0 18px 40px rgba(10,40,90,.12)}
.login-container{width:min(940px,94%);margin:18px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.login-card{position:relative;padding:20px 15px 21px;text-align:center;border-radius:20px;background:linear-gradient(145deg,#fff,#edf4fb);border:1px solid #d7e2ef;box-shadow:0 14px 30px rgba(13,46,83,.10),inset 0 1px 0 #fff;transition:.3s;overflow:hidden}
.login-card:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#b58a20,#efd36b,#b58a20)}
.login-card:hover{transform:translateY(-5px);box-shadow:0 22px 38px rgba(13,46,83,.15)}
.login-icon{width:57px;height:57px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;border-radius:16px;color:#fff;font-size:22px;background:linear-gradient(145deg,#5799e8,#0b3d91);border:1px solid #8ab0dc;box-shadow:0 5px 0 #062d68,0 10px 21px rgba(11,61,145,.20)}
.login-card h3{color:#12366e;font-size:15px;font-weight:900}
.login-card p{color:#8491a7;font-size:9px;margin-top:3px}
.login-btn{position:relative;display:block;margin-top:12px;padding:12px 8px;text-decoration:none;text-align:center;color:#fff;border:1px solid #82a9d7;border-radius:10px;font-size:10px;font-weight:900;letter-spacing:.7px;background:linear-gradient(180deg,#5a9bea,#286dc1 55%,#0b3d91);box-shadow:0 4px 0 #062d68,0 9px 18px rgba(11,61,145,.20),inset 0 1px 1px rgba(255,255,255,.35);transition:.15s}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #062d68,0 13px 22px rgba(11,61,145,.25)}
.login-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #062d68,0 5px 10px rgba(11,61,145,.18)}
/* Full-width blinking APPLICATION PORTAL button in place of old announcement box */
.application-portal-wrap{width:100%;margin:21px 0 0;padding:0}
.application-portal-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:66px;padding:17px 12px;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(180deg,#d94848 0%,#a40000 52%,#650000 100%);border-top:2px solid #f0c56a;border-bottom:2px solid #f0c56a;font-size:clamp(17px,4vw,23px);font-weight:900;letter-spacing:1px;text-shadow:0 2px 3px rgba(0,0,0,.3);box-shadow:0 9px 22px rgba(120,0,0,.25);animation:applicationBlink 1.8s ease-in-out infinite}
.application-portal-btn i{font-size:23px}
@keyframes applicationBlink{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.72;filter:brightness(1.2)}}
.application-portal-btn:active{transform:scale(.99)}
.footer{width:100%;margin-top:27px;min-height:65px;padding:20px 12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(135deg,#0b3d91,#082f70);border-top:3px solid #d5b143}
.footer .developer{width:100%;margin:0;text-align:center;white-space:nowrap;font-size:16px;font-weight:900;line-height:1.4;letter-spacing:.3px}
.footer strong{color:#f4d56d;font-weight:900}
.whatsapp-btn{position:fixed;right:17px;bottom:17px;width:53px;height:53px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;background:#25D366;text-decoration:none;font-size:25px;box-shadow:0 5px 0 #159947,0 12px 24px rgba(37,211,102,.28);z-index:999}
@media(max-width:700px){
.school-card{padding:17px 7px 22px}.logo{width:74px;height:74px}.school-name{font-size:clamp(25px,7.8vw,32px);letter-spacing:0;white-space:nowrap}.school-place{margin-top:5px;font-size:9px;letter-spacing:2px}
.result-panel{width:96%;margin-top:9px;padding:20px 11px 23px;border-radius:21px}#examTitle{font-size:clamp(20px,6vw,25px)!important;color:#b45309!important}#sessionTitle{font-size:10px}
.live{margin:8px auto 17px;padding:7px 16px;font-size:9px}.result-form{grid-template-columns:1fr 1fr;gap:9px}.field{border-width:2px;border-radius:15px}.result-input{height:58px;padding:0 11px;font-size:10px;border-radius:12px}.view-result-btn{height:59px;margin-top:18px;font-size:12px;letter-spacing:1px}
.notice-inner marquee{min-height:50px;padding:12px 9px;font-size:18px;font-weight:900;white-space:nowrap}#countdown{display:none!important;font-size:10px!important}
.login-container{width:96%;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.login-card{padding:14px 4px 15px;border-radius:15px}.login-icon{width:41px;height:41px;border-radius:11px;font-size:16px;margin-bottom:7px}.login-card h3{font-size:8px}.login-card p{display:none}.login-btn{margin-top:7px;padding:9px 2px;font-size:7px}
.application-portal-wrap{margin-top:16px}.application-portal-btn{min-height:60px;padding:15px 8px;font-size:17px;letter-spacing:.5px}.application-portal-btn i{font-size:19px}
.footer{min-height:58px;margin-top:18px;padding:16px 8px}.footer .developer{font-size:12px}.whatsapp-btn{width:47px;height:47px;right:13px;bottom:13px;font-size:22px}
}
@media(max-width:380px){
.school-name{font-size:23px}.logo{width:64px;height:64px}#examTitle{font-size:18px!important}#sessionTitle{font-size:9px}.result-input{height:55px;font-size:9px}.view-result-btn{height:55px;font-size:11px}.notice-inner marquee{min-height:48px;font-size:16px;padding:11px 8px;white-space:nowrap}.footer{min-height:55px;padding:14px 7px}.footer .developer{font-size:9px}.login-card h3{font-size:7px}.login-btn{font-size:6.5px}.application-portal-btn{font-size:15px}
}
@media(prefers-reduced-motion:reduce){.application-portal-btn{animation:none}}
</style>
</head>
<body>

<!-- STUDENTS' IMAGE -->
<section class="hero-image">
  <img src="premium-students.jpg" alt="IPS PUBLIC SCHOOL Students">
</section>

<!-- ANNOUNCEMENT STRIP: immediately below the students' image -->
<section class="notice-section" id="noticeBox" aria-label="Latest announcements">
  <div class="notice-inner">
    <marquee id="noticeTextShow" behavior="scroll" direction="left" scrollamount="5">IPS PUBLIC SCHOOL - LATEST ANNOUNCEMENTS</marquee>
    <div id="countdown"></div>
  </div>
</section>

<div class="main-container">
  <section class="school-card">
    <div class="luxury-line"></div>
    <div class="logo"><img src="logo.png" alt="IPS PUBLIC SCHOOL Logo"></div>
    <h1 class="school-name">IPS PUBLIC SCHOOL</h1>
    <p class="school-place">AHIRORI • HARDOI</p>

    <div class="result-panel">
      <div class="result-heading-line"></div>
      <h2 id="examTitle">Loading...</h2>
      <h3 id="sessionTitle">Loading...</h3>
      <div class="live" id="resultLive">Loading...</div>

      <div class="result-form">
        <div class="field">
          <select class="result-input" id="class">
            <option selected disabled>Select Class</option>
            <option>Class 2</option><option>Class 3</option><option>Class 4</option>
            <option>Class 5</option><option>Class 6</option><option>Class 7</option>
            <option>Class 8</option><option>Class 9</option><option>Class 10</option>
          </select>
        </div>
        <div class="field">
          <input type="number" id="roll" class="result-input" placeholder="Enter Roll Number">
        </div>
      </div>

      <button class="view-result-btn" onclick="searchResult()">
        <i class="fa-solid fa-magnifying-glass"></i>&nbsp;&nbsp; VIEW RESULT
      </button>
    </div>
  </section>

  <div id="result"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-user-graduate"></i></div>
      <h3>Student Login</h3><p>Student Portal</p>
      <a href="student-login.html" class="login-btn">LOGIN &nbsp;<i class="fa-solid fa-arrow-right"></i></a>
    </div>
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-chalkboard-user"></i></div>
      <h3>Staff Login</h3><p>Staff Portal</p>
      <a href="staff-login.html" class="login-btn">LOGIN &nbsp;<i class="fa-solid fa-arrow-right"></i></a>
    </div>
    <div class="login-card">
      <div class="login-icon"><i class="fa-solid fa-user-shield"></i></div>
      <h3>Admin Login</h3><p>Administration</p>
      <a href="login.html" class="login-btn">LOGIN &nbsp;<i class="fa-solid fa-arrow-right"></i></a>
    </div>
  </div>

  <!-- APPLICATION PORTAL button replaces the old announcement box -->
  <div class="application-portal-wrap">
    <a href="application-portal.html" class="application-portal-btn">
      <i class="fa-solid fa-file-circle-check"></i>
      <span>APPLICATION PORTAL</span>
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>
</div>

<footer class="footer">
  <p class="developer">Developed &amp; Designed by <strong>A.K. SINGH CHANDEL</strong></p>
</footer>

<a href="https://wa.me/8127803733" class="whatsapp-btn" target="_blank" rel="noopener" aria-label="WhatsApp">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<script type="module" src="app.js"></script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./sw.js")
      .then(function(){console.log("IPSPS Service Worker Registered Successfully");})
      .catch(function(error){console.error("IPSPS Service Worker Registration Failed:",error);});
  });
}
</script>
</body>
</html>
