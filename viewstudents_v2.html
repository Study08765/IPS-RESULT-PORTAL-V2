<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>View Students V2 | IPS PUBLIC SCHOOL</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:
linear-gradient(135deg,#eef3f9,#f8fafc);
color:#172033;
padding:20px;
}

/* MAIN BOX */

.box{
max-width:1200px;
margin:auto;
}

/* HEADER */

.header{
background:linear-gradient(135deg,#071b3d,#0b3d91,#142d5c);
color:white;
padding:28px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 12px 35px rgba(0,0,0,.18);
margin-bottom:20px;
position:relative;
overflow:hidden;
}

.header:after{
content:"";
position:absolute;
width:180px;
height:180px;
border:1px solid rgba(255,255,255,.15);
border-radius:50%;
right:-50px;
top:-70px;
}

.header h1{
margin:0;
font-size:27px;
letter-spacing:1px;
}

.header p{
margin:8px 0 0;
font-size:14px;
opacity:.9;
letter-spacing:1px;
}

/* SEARCH */

.searchBox{
background:white;
padding:16px;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:22px;
}

#search{
width:100%;
padding:14px 17px;
border:1px solid #d9e0ea;
border-radius:12px;
font-size:16px;
outline:none;
transition:.2s;
}

#search:focus{
border-color:#0b3d91;
box-shadow:0 0 0 3px rgba(11,61,145,.1);
}

/* CLASS CARD */

.class-card{
background:white;
border-radius:18px;
margin-bottom:24px;
overflow:hidden;
box-shadow:0 8px 28px rgba(0,0,0,.09);
border:1px solid #e7ebf2;
}

/* CLASS HEADER */

.class-header{
background:linear-gradient(135deg,#0b3d91,#092b68);
color:white;
padding:17px 18px;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
}

.class-title{
font-size:20px;
font-weight:bold;
letter-spacing:.5px;
}

.student-count{
font-size:13px;
background:rgba(255,255,255,.15);
padding:7px 12px;
border-radius:20px;
}

/* DOWNLOAD */

.download-btn{
background:linear-gradient(135deg,#c99a2e,#f0c75e);
color:#17120a;
border:none;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.18);
}

.download-btn:hover{
transform:translateY(-1px);
}

/* TABLE */

.table-wrap{
width:100%;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:760px;
}

th{
background:#f1f4f9;
color:#233451;
font-size:13px;
padding:13px 10px;
border-bottom:2px solid #dce3ed;
}

td{
padding:12px 10px;
border-bottom:1px solid #edf0f4;
text-align:center;
font-size:14px;
}

tr:hover td{
background:#f8fbff;
}

/* NAME */

.name-cell{
font-weight:bold;
color:#132c55;
}

/* BUTTONS */

.action-btn{
border:none;
padding:7px 10px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin:2px;
}

.edit{
background:#e8f7ed;
color:#16803c;
}

.delete{
background:#fdebec;
color:#c62828;
}

.action-btn:hover{
transform:translateY(-1px);
}

/* EMPTY */

.empty{
padding:35px;
text-align:center;
color:#777;
}

/* NO RESULT */

.no-result{
display:none;
background:white;
padding:35px;
text-align:center;
border-radius:16px;
box-shadow:0 5px 20px rgba(0,0,0,.07);
color:#777;
}

/* MOBILE */

@media(max-width:650px){

body{
padding:10px;
}

.header{
padding:23px 12px;
border-radius:16px;
}

.header h1{
font-size:21px;
}

.header p{
font-size:12px;
}

.class-header{
padding:14px;
}

.class-title{
font-size:17px;
}

.download-btn{
width:100%;
}

}

/* PRINT */

@media print{

body{
background:white;
padding:0;
}

.header,
.searchBox,
.download-btn,
.action-btn{
display:none!important;
}

.class-card{
box-shadow:none;
border:1px solid #ddd;
page-break-inside:avoid;
}

}

</style>

</head>

<body>

<div class="box">

<div class="header">

<h1>IPS PUBLIC SCHOOL AHIRORI HARDOI</h1>

<p>STUDENT MANAGEMENT • SESSION 2026–27</p>

</div>


<div class="searchBox">

<input
type="text"
id="search"
placeholder="🔍 Search student by Roll Number, Name, Class, Exam or Session..."
autocomplete="off">

</div>


<div id="classContainer"></div>

<div id="noResult" class="no-result">

<h3>🔎 No Student Found</h3>

<p>Search करके किसी दूसरे student को देखें।</p>

</div>

</div>


<!-- jsPDF -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>


<script type="module" src="view_v2.js"></script>

</body>
  </html>
