<style>

/* ================= GLOBAL ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    height:100%;
}

body{
    height:100%;
    background:#eef4ff;
    overflow-x:hidden;
    margin:0;
    animation:fadeIn 0.8s ease;
}


/* ================= HERO ================= */

.hero{
    min-height:57vh;

    background:url("hero-bg.jpg");

    background-size:cover;

    background-position:center;

    position:relative;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:5px 20px 15px;
}

.hero-content{
    max-width:700px;
    position:relative;
    z-index:2;
    margin-top:-35px;
}


/* ================= LOGO ================= */

.logo{
    width:120px;
    height:120px;

    margin:0 auto 15px;

    background:#ffffff;

    border-radius:50%;

    padding:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    border:4px solid #FFD700;

    box-shadow:
        0 0 20px rgba(255,215,0,.6),
        0 10px 30px rgba(0,0,0,.25);

    transition:.4s;
}

.logo:hover{
    transform:scale(1.08) rotate(5deg);

    box-shadow:
        0 0 35px rgba(255,215,0,.9),
        0 15px 35px rgba(0,0,0,.35);
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%;
}


/* ================= SCHOOL TITLE ================= */

.hero h1{
    color:#0B3D91;

    font-size:50px;

    font-weight:900;

    letter-spacing:3px;

    margin-top:15px;

    text-transform:uppercase;

    -webkit-text-stroke:1px #ffffff;

    text-shadow:
        0 3px 10px rgba(255,255,255,.9),
        0 4px 15px rgba(0,0,0,.4);

    animation:glow 2s infinite alternate;
}

.hero p{
    color:#0B3D91;

    font-weight:700;

    text-shadow:0 2px 6px rgba(255,255,255,.8);

    margin-top:10px;

    font-size:18px;
}


/* ================= LIVE STATUS ================= */

.live{
    display:inline-block;

    margin-top:20px;

    background:linear-gradient(135deg,#22c55e,#16a34a);

    padding:10px 25px;

    color:white;

    box-shadow:0 0 25px rgba(34,197,94,.6);

    border-radius:50px;

    font-weight:600;
}


/* ================= SEARCH CARD ================= */

.search-card{

    width:90%;

    max-width:520px;

    margin:20px auto 0;

    padding:20px;

    background:rgba(255,255,255,.18);

    backdrop-filter:blur(18px);

    border-radius:30px;

    border:1.5px solid rgba(255,255,255,.55);

    box-shadow:
        0 25px 60px rgba(0,0,0,.35),
        0 0 25px rgba(255,255,255,.18);

    animation:floatCard 4s ease-in-out infinite;

    transition:0.4s ease;

    transform:translateY(0);
}

.search-card:hover{
    transform:translateY(-10px);
}

.search-title{

    color:#fff;

    text-shadow:0 0 15px rgba(255,255,255,.5);

    font-size:24px;

    margin-bottom:20px;
}

.input-box{

    width:100%;

    padding:16px;

    background:rgba(255,255,255,.95);

    border:2px solid rgba(255,255,255,.25);

    outline:none;

    border-radius:15px;

    font-size:17px;

    box-shadow:0 8px 20px rgba(0,0,0,.08);

    margin-bottom:18px;
}

select.input-box{

    appearance:none;

    -webkit-appearance:none;

    background:white;

    cursor:pointer;
}


/* ================= RESULT BUTTON ================= */

.result-btn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:15px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    background:linear-gradient(
        135deg,
        #0b3d91,
        #2563eb,
        #60a5fa
    );

    color:white;

    box-shadow:0 12px 30px rgba(37,99,235,.45);

    letter-spacing:1.5px;

    text-transform:uppercase;

    transition:.3s ease;
}

.result-btn:hover{

    transform:translateY(-5px) scale(1.03);

    box-shadow:0 18px 40px rgba(37,99,235,.60);
}


/* ================= HERO BOTTOM ================= */

.hero::after{

    content:"";

    position:absolute;

    left:0;

    bottom:0;

    width:100%;

    height:80px;

    background:#eef4ff;

    border-radius:100% 100% 0 0;
}


/* ================= LOGIN CARDS ================= */

.login-card{

    width:240px;

    padding:20px;

    margin:10px auto;

    background:#ffffff;

    border-radius:20px;

    text-align:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    transition:0.3s ease;

    cursor:pointer;
}

.login-card:hover{

    transform:translateY(-10px);

    box-shadow:0 18px 40px rgba(0,0,0,.22);
}

.login-card i{

    font-size:50px;

    color:#0b3d91;

    margin-bottom:15px;
}

.login-card h3{

    font-size:22px;

    color:#0b3d91;

    margin-top:10px;

    font-weight:700;
}

.login-btn{

    display:block;

    text-decoration:none;

    text-align:center;

    width:100%;

    padding:14px;

    margin-top:18px;

    border:none;

    border-radius:12px;

    background:linear-gradient(
        135deg,
        #0b3d91,
        #1e88e5
    );

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.login-btn:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 25px rgba(11,61,145,.35);

    transition:.3s;
}

.login-container{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:15px;

    padding:10px;
}


/* ================= NOTICE ================= */

.notice-section{

    width:90%;

    max-width:800px;

    margin:5px auto;

    padding:10px;

    background:#ffffff;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    text-align:center;
}

.notice-section h2{

    color:#0b3d91;

    font-size:28px;

    margin-bottom:15px;

    font-weight:700;
}

.notice-section p{

    color:#555;

    font-size:17px;

    line-height:1.8;
}

.notice-section marquee{

    color:#d32f2f;

    font-size:18px;

    font-weight:600;

    padding:10px 0;
}


/* ================= QUICK LINKS ================= */

.quick-links{

    width:90%;

    max-width:1100px;

    margin:30px auto;

    text-align:center;
}

.quick-links h2{

    font-size:28px;

    color:#0b3d91;

    margin-bottom:20px;
}

.quick-container{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:20px;
}

.quick-card{

    width:300px;

    height:120px;

    background:#ffffff;

    border-radius:16px;

    padding:15px;

    text-decoration:none;

    color:#0b3d91;

    box-shadow:0 8px 20px rgba(0,0,0,.15);

    transition:.3s;
}

.quick-card:hover{

    transform:translateY(-6px);

    box-shadow:0 15px 30px rgba(0,0,0,.25);
}

.quick-card h3{

    margin-top:10px;

    font-size:18px;
}

.quick-card i{

    font-size:32px;

    color:#0b3d91;

    margin-bottom:12px;

    display:block;
}


/* ================= RESULT CARD ================= */

.result-card{

    width:95%;

    max-width:900px;

    margin:25px auto;

    background:#fff;

    padding:25px;

    border-radius:20px;

    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.result-header{

    text-align:center;

    margin-bottom:20px;
}

.info-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(180px,1fr));

    gap:15px;

    margin:20px 0;
}

.info-box{

    background:#f5f8ff;

    padding:12px;

    border-radius:12px;

    text-align:center;

    font-weight:600;
}

.resultTable{

    width:100%;

    border-collapse:collapse;

    margin-top:20px;
}

.resultTable th{

    background:#0b3d91;

    color:#fff;

    padding:12px;
}

.resultTable td{

    padding:10px;

    border:1px solid #ddd;

    text-align:center;
}

.summary{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));

    gap:15px;

    margin-top:20px;
}

.summary div{

    background:#eef4ff;

    padding:15px;

    border-radius:12px;

    text-align:center;
}

.pass{

    background:#d4edda!important;

    color:#198754;
}

.fail{

    background:#f8d7da!important;

    color:#dc3545;
}

.result-card button{

    margin-top:20px;

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#0b3d91;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}


/* ================= FOOTER ================= */

.footer{

    width:100%;

    background:#0b3d91;

    border-top:2px solid #FFD700;

    padding:15px 20px;

    margin:0;

    text-align:center;

    box-sizing:border-box;
}

.footer .developer{

    margin:0;

    color:#fff;

    font-size:16px;

    font-weight:600;

    line-height:1.5;
}

.footer .developer strong{

    color:#FFD700;

    font-weight:700;
}


/* ================= DEVELOPER ================= */

.developer{

    margin-top:15px;

    font-size:17px;

    color:#FFD700;

    font-weight:500;

    letter-spacing:1px;
}

.developer strong{

    color:#ffffff;

    font-weight:700;
}


/* ================= TOP BUTTON ================= */

#topBtn{

    display:none;

    position:fixed;

    bottom:25px;

    right:25px;

    width:55px;

    height:55px;

    border:none;

    border-radius:50%;

    background:#0b3d91;

    color:#fff;

    font-size:24px;

    cursor:pointer;

    box-shadow:0 8px 20px rgba(11,61,145,.4);

    transition:.3s;

    z-index:999;
}

#topBtn:hover{

    transform:scale(1.1);

    background:#1565c0;
}


/* ================= WHATSAPP ================= */

.whatsapp-btn{

    position:fixed;

    bottom:95px;

    right:25px;

    width:60px;

    height:60px;

    background:#25D366;

    color:#fff;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    font-size:30px;

    box-shadow:0 8px 20px rgba(37,211,102,.4);

    transition:.3s;

    z-index:999;
}

.whatsapp-btn:hover{

    transform:scale(1.1);

    box-shadow:0 12px 25px rgba(37,211,102,.6);
}


/* ================= ANIMATIONS ================= */

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(20px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}

@keyframes glow{

    from{

        text-shadow:
        0 0 10px rgba(255,255,255,.4);
    }

    to{

        text-shadow:
        0 0 25px rgba(255,255,255,.9);
    }
}

@keyframes floatCard{

    0%,100%{

        transform:translateY(0);
    }

    50%{

        transform:translateY(-6px);
    }
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .hero h1{

        font-size:32px;

        letter-spacing:1px;
    }

    .hero p{

        font-size:15px;
    }

    .logo{

        width:100px;

        height:100px;
    }

    #examTitle{

        font-size:24px!important;
    }

    .search-title{

        font-size:20px;
    }

    .login-card{

        width:90%;

        max-width:300px;
    }

    .quick-card{

        width:90%;

        max-width:300px;
    }

}


/* ================= SAFE AREA FOR MOBILE APP ================= */

@supports(padding: env(safe-area-inset-top)){

    body{

        padding-top:env(safe-area-inset-top);

        padding-bottom:env(safe-area-inset-bottom);
    }
}

</style>

</head>

<script>

let topBtn =
document.getElementById("topBtn");


window.onscroll = function(){

    if(
        document.body.scrollTop > 200 ||
        document.documentElement.scrollTop > 200

        topBtn.style.display = "block";

    }else{

        topBtn.style.display = "none";

    }

};
