<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>IPSPS PORTAL | IPS PUBLIC SCHOOL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{
  --navy:#082f70;--blue:#0b3d91;--blue2:#286dc1;--gold:#d6ad43;
  --gold-light:#ffe69a;--ink:#17345d;--muted:#74839a;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
html{scroll-behavior:smooth}
body{min-height:100vh;background:linear-gradient(180deg,#edf3fb 0%,#f8faff 52%,#eaf1fa 100%);color:var(--ink);overflow-x:hidden}
.hero{width:100%;line-height:0;background:#dce8f5}
.hero img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;object-position:center}
.top-notice{width:100%;padding:9px 12px;background:linear-gradient(180deg,#fff 0%,#f5f7fb 100%);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);box-shadow:0 5px 13px rgba(20,48,86,.13);overflow:hidden}
.top-notice-inner{min-height:34px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.notice-label{flex:none;color:var(--blue);font-size:12px;font-weight:900;letter-spacing:1px}
#topWelcomeText{color:#8a5700;font-size:clamp(23px,4vw,31px);font-weight:900;line-height:1.35;letter-spacing:.45px;animation:noticeBlink 1.4s ease-in-out infinite}
@keyframes noticeBlink{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.22}55%{opacity:1}}
.page{width:min(1120px,96%);margin:0 auto;padding:24px 0 0}
.login-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin:0 auto 26px}
.login-card{min-width:0;min-height:90px;display:flex;align-items:center;gap:15px;padding:15px 19px;text-decoration:none;color:#fff;border:1px solid #e4c76c;border-radius:17px;background:linear-gradient(180deg,#347fd4 0%,#1453a6 48%,#082f70 100%);box-shadow:0 6px 0 #062653,0 12px 22px rgba(8,47,112,.20),inset 0 2px 2px rgba(255,255,255,.32);transition:transform .18s,box-shadow .18s}
.login-card:hover{transform:translateY(-3px);box-shadow:0 9px 0 #062653,0 17px 25px rgba(8,47,112,.23),inset 0 2px 2px rgba(255,255,255,.32)}
.login-card:active{transform:translateY(4px);box-shadow:0 2px 0 #062653,0 6px 12px rgba(8,47,112,.18)}
.login-icon{width:49px;height:49px;flex:none;display:grid;place-items:center;border-radius:13px;color:#123d78;background:linear-gradient(145deg,#fff,#e7edf6);border:1px solid #f2d77f;box-shadow:0 3px 0 #b88a24;font-size:22px}
.login-text{min-width:0;flex:1}
.login-text strong{display:block;font-size:clamp(13px,2.3vw,18px);font-weight:900;line-height:1.25;letter-spacing:.35px}
.login-text small{display:block;margin-top:3px;color:#d8e8ff;font-size:10px;font-weight:600}
.login-arrow{flex:none;color:var(--gold-light);font-size:20px}
.result-panel{position:relative;width:100%;margin:0 auto 23px;padding:30px clamp(14px,4vw,42px) 34px;border:2px solid #d5ae45;border-radius:27px;background:linear-gradient(145deg,#fff 0%,#f8fbff 55%,#edf4fc 100%);box-shadow:0 7px 0 #b98d2e,0 18px 35px rgba(13,47,91,.15),inset 0 2px 0 #fff;overflow:hidden}
.result-panel:before{content:"";position:absolute;inset:8px;border:1px solid rgba(213,174,69,.35);border-radius:20px;pointer-events:none}
.result-panel:after{content:"";position:absolute;width:270px;height:270px;right:-160px;top:-170px;border-radius:50%;background:radial-gradient(circle,rgba(213,174,69,.12),transparent 70%);pointer-events:none}
.result-content{position:relative;z-index:1}
.result-top-line{width:86px;height:4px;margin:0 auto 12px;border-radius:9px;background:linear-gradient(90deg,#a97817,#f5db82,#a97817)}
#examTitle{margin:0;text-align:center;color:#a66a0b;font-size:clamp(25px,5vw,39px);font-weight:900;line-height:1.2;letter-spacing:.4px}
#sessionTitle{margin:8px 0 0;text-align:center;color:#31527f;font-size:clamp(12px,2.2vw,16px);font-weight:800}
.live{width:max-content;max-width:100%;display:flex;align-items:center;justify-content:center;gap:9px;margin:18px auto 25px;padding:9px 23px;border:1px solid #a3e6c7;border-radius:50px;color:#fff;background:linear-gradient(180deg,#35c98d,#087a50);box-shadow:0 5px 0 #075c3d,0 9px 17px rgba(8,122,80,.18);font-size:12px;font-weight:900;letter-spacing:.7px}
.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.result-form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{min-width:0;padding:3px;border:2px solid #d2a83e;border-radius:15px;background:linear-gradient(145deg,#fff,#f4f7fc);box-shadow:0 5px 0 #b98d2e,0 9px 16px rgba(20,50,90,.10)}
.result-input{width:100%;height:62px;padding:0 17px;border:0;outline:0;border-radius:10px;background:#fff;color:#193b6d;font-size:15px;font-weight:600}
.result-input:focus{box-shadow:inset 0 0 0 2px rgba(40,109,193,.35)}
select.result-input{cursor:pointer}
.view-result-btn{position:relative;display:block;width:min(580px,100%);min-height:69px;margin:25px auto 0;border:1px solid #e6c86e;border-radius:16px;color:#fff;background:linear-gradient(180deg,#4d96e9 0%,#1760b4 50%,#082f70 100%);box-shadow:0 6px 0 #062653,0 13px 23px rgba(8,47,112,.23),inset 0 2px 2px rgba(255,255,255,.35);font-size:clamp(16px,3vw,21px);font-weight:900;letter-spacing:1.2px;cursor:pointer;transition:.15s}
.view-result-btn:hover{transform:translateY(-2px)}
.view-result-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #062653,0 6px 12px rgba(8,47,112,.18)}
#result:empty{display:none}
#result:not(:empty){width:min(100%,1000px);margin:18px auto;padding:22px;border:1px solid #d9e3ef;border-radius:18px;background:#fff;box-shadow:0 10px 25px rgba(13,47,91,.10);overflow-x:auto}
.bottom-notice{display:flex;align-items:center;gap:14px;min-height:58px;margin:0 0 23px;padding:10px 17px;border:1px solid #d9b653;border-radius:13px;background:linear-gradient(180deg,#fff,#f2f6fc);box-shadow:0 5px 0 #c39b3d,0 10px 19px rgba(13,47,91,.10);overflow:hidden}
.bottom-notice-label{flex:none;color:#fff;background:linear-gradient(180deg,#347fd4,#082f70);padding:8px 13px;border-radius:8px;font-size:11px;font-weight:900;letter-spacing:.8px}
.bottom-track{min-width:0;flex:1;overflow:hidden;white-space:nowrap}
.bottom-track span{display:inline-block;padding-left:100%;color:#24436d;font-size:18px;font-weight:900;line-height:1.35;white-space:nowrap;animation:scrollNotice 22s linear infinite}
@keyframes scrollNotice{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.footer{min-height:65px;padding:18px 12px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(135deg,#0b3d91,#082f70);border-top:3px solid var(--gold)}
.footer p{font-size:clamp(11px,2.3vw,16px);font-weight:800;letter-spacing:.2px}
.footer strong{color:#ffe17a;font-weight:900}
.whatsapp-btn{position:fixed;right:17px;bottom:17px;width:49px;height:49px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#25d366;text-decoration:none;font-size:24px;box-shadow:0 4px 0 #159947,0 9px 18px rgba(37,211,102,.25);z-index:20}
@media(max-width:600px){
 .hero img{width:100%;height:auto;max-height:none;object-fit:contain}
 .top-notice{padding:10px 8px}.top-notice-inner{gap:7px;min-height:46px}#topWelcomeText{font-size:clamp(19px,5vw,23px)}
 .page{width:94%;padding-top:17px}
 .login-grid{gap:11px;margin-bottom:22px}
 .login-card{min-height:76px;padding:11px 9px;gap:8px;border-radius:13px}
 .login-icon{width:36px;height:36px;border-radius:10px;font-size:16px}
 .login-text strong{font-size:10px;letter-spacing:0}.login-text small{display:none}.login-arrow{font-size:14px}
 .result-panel{padding:25px 12px 29px;border-radius:21px}
 .result-form{grid-template-columns:1fr;gap:12px}
 .result-input{height:58px;font-size:14px}
 .live{margin:15px auto 20px}
 .view-result-btn{min-height:61px;margin-top:21px}
 .bottom-notice{min-height:53px;gap:8px;padding:8px;border-radius:11px}
 .bottom-notice-label{font-size:9px;padding:8px}
 .bottom-track span{font-size:15px}
 .footer{min-height:57px}
 .whatsapp-btn{width:44px;height:44px;right:12px;bottom:12px;font-size:21px}
}
@media(prefers-reduced-motion:reduce){
 #topWelcomeText,.bottom-track span{animation:none}
 .bottom-track span{padding-left:0;white-space:normal}
 *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>
<body>

<!-- TOP SCHOOL BANNER: keep the new image in the same folder as this file -->
<header class="hero">
  <img src="ips-school-banner.jpg" alt="IPS PUBLIC SCHOOL, Ahirori Hardoi">
</header>

<!-- TOP NOTICE: replace the messages in topNotices below -->
<section class="top-notice" aria-label="Welcome and study status">
  <div class="top-notice-inner">
    <span id="topWelcomeText" aria-live="polite">WELCOME TO IPS PUBLIC SCHOOL</span>
  </div>
</section>

<main class="page">

  <!-- FOUR 3D BUTTONS: two rows, two buttons in each row -->
  <nav class="login-grid" aria-label="Portal login links">
    <a href="student-login.html" class="login-card">
      <span class="login-icon"><i class="fa-solid fa-user-graduate"></i></span>
      <span class="login-text"><strong>STUDENT LOGIN</strong><small>Student Portal</small></span>
      <i class="fa-solid fa-circle-arrow-right login-arrow"></i>
    </a>
    <a href="staff-login.html" class="login-card">
      <span class="login-icon"><i class="fa-solid fa-chalkboard-user"></i></span>
      <span class="login-text"><strong>STAFF LOGIN</strong><small>Staff Portal</small></span>
      <i class="fa-solid fa-circle-arrow-right login-arrow"></i>
    </a>
    <a href="login.html" class="login-card">
      <span class="login-icon"><i class="fa-solid fa-user-shield"></i></span>
      <span class="login-text"><strong>ADMIN LOGIN</strong><small>Administration</small></span>
      <i class="fa-solid fa-circle-arrow-right login-arrow"></i>
    </a>
    <a href="application-portal.html" class="login-card">
      <span class="login-icon"><i class="fa-solid fa-file-circle-check"></i></span>
      <span class="login-text"><strong>APPLICATION PORTAL</strong><small>Online Application</small></span>
      <i class="fa-solid fa-circle-arrow-right login-arrow"></i>
    </a>
  </nav>

  <!-- RESULT SECTION: IDs are retained for the existing app.js -->
  <section class="result-panel" aria-label="Result search">
    <div class="result-content">
      <div class="result-top-line"></div>
      <h1 id="examTitle">Loading...</h1>
      <h2 id="sessionTitle">Loading...</h2>
      <div class="live" id="resultLive">Loading...</div>

      <div class="result-form">
        <div class="field">
          <select class="result-input" id="class" aria-label="Select Class">
            <option value="" selected disabled>Select Class</option>
            <option>Class 2</option><option>Class 3</option><option>Class 4</option>
            <option>Class 5</option><option>Class 6</option><option>Class 7</option>
            <option>Class 8</option><option>Class 9</option><option>Class 10</option>
          </select>
        </div>
        <div class="field">
          <input type="number" id="roll" class="result-input" placeholder="Enter Roll Number" aria-label="Enter Roll Number" inputmode="numeric">
        </div>
      </div>

      <button type="button" class="view-result-btn" onclick="searchResult()">
        <i class="fa-solid fa-magnifying-glass"></i>&nbsp; VIEW RESULT
      </button>
    </div>
  </section>

  <div id="result" aria-live="polite"></div>

  <!-- BOTTOM NOTICE BAR -->
  <section class="bottom-notice" id="noticeBox" aria-label="Latest admin notice">
    <span class="bottom-notice-label"><i class="fa-solid fa-bell"></i> LATEST NOTICE</span>
    <div class="bottom-track"><span id="noticeTextShow">Admin notice will appear here</span></div>
  </section>
</main>

<footer class="footer">
  <p>Developed &amp; Designed by <strong>A.K. SINGH CHANDEL</strong></p>
</footer>

<a href="https://wa.me/8127803733" class="whatsapp-btn" target="_blank" rel="noopener" aria-label="WhatsApp">
  <i class="fa-brands fa-whatsapp"></i>
</a>

<script>
/* Top strip: welcome and school messages change every 2.8 seconds. */
const welcomeStudyMessages = [
  "WELCOME TO IPS PUBLIC SCHOOL",
  "REGULAR CLASSES & LEARNING IN PROGRESS",
  "DISCIPLINE • LEARNING • SUCCESS"
];
let welcomeStudyIndex = 0;
const welcomeStudyBox = document.getElementById("topWelcomeText");
const welcomeColors = ["#8a5700", "#0b3d91", "#c62828", "#087a50", "#7b1fa2", "#d35400"];
let welcomeColorIndex = 0;

window.setInterval(() => {
  welcomeStudyIndex = (welcomeStudyIndex + 1) % welcomeStudyMessages.length;
  welcomeStudyBox.textContent = welcomeStudyMessages[welcomeStudyIndex];
}, 2800);

window.setInterval(() => {
  welcomeColorIndex = (welcomeColorIndex + 1) % welcomeColors.length;
  welcomeStudyBox.style.color = welcomeColors[welcomeColorIndex];
}, 5000);
</script>

<!-- Keep the existing Firebase/result logic in app.js -->
<script type="module" src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js")
      .then(function () { console.log("IPSPS Service Worker Registered Successfully"); })
      .catch(function (error) { console.error("IPSPS Service Worker Registration Failed:", error); });
  });
}
</script>
</body>
</html>
