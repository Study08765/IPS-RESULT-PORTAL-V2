<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#0b3d91">

<link
rel="icon"
type="image/png"
sizes="192x192"
href="./icon-192.png">

<link
rel="apple-touch-icon"
href="./icon-192.png">

<title>IPSPS PORTAL - IPS PUBLIC SCHOOL</title>


<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

/* =====================================================
GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:
    radial-gradient(
        circle at 8% 12%,
        rgba(46,111,207,.08),
        transparent 28%
    ),

    radial-gradient(
        circle at 92% 60%,
        rgba(213,174,62,.06),
        transparent 25%
    ),

    #f1f5fa;

    color:#17345f;

    overflow-x:hidden;
}


/* =====================================================
FULL WIDTH IMAGE
===================================================== */

.hero-image{

    width:100%;

    margin:0;

    padding:0;

    line-height:0;

    overflow:hidden;

    background:#eaf0f7;

    border-bottom:
    2px solid #d5b44a;
}

.hero-image img{

    width:100%;

    height:auto;

    display:block;

    object-fit:contain;

    object-position:center;

    filter:
    brightness(1.05)
    saturate(.95)
    contrast(.97);
}


/* =====================================================
MAIN FULL WIDTH
===================================================== */

.main-container{

    width:100%;

    margin:0;

    padding:0;

}


/* =====================================================
SCHOOL BRANDING
===================================================== */

.school-card{

    position:relative;

    width:100%;

    padding:
    22px
    18px
    25px;

    background:

    linear-gradient(
        145deg,
        #ffffff 0%,
        #f7faff 48%,
        #edf4fc 100%
    );

    border-bottom:
    1px solid #d7e2ef;

    box-shadow:

    0 15px 38px
    rgba(15,49,87,.10),

    inset 0 1px 0 #ffffff;

    overflow:hidden;
}


.school-card::before{

    content:"";

    position:absolute;

    width:300px;
    height:300px;

    right:-190px;
    top:-180px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(53,113,202,.09),
        transparent 68%
    );

    pointer-events:none;
}


.school-card::after{

    content:"";

    position:absolute;

    width:250px;
    height:250px;

    left:-170px;
    bottom:-180px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(211,174,55,.07),
        transparent 70%
    );

    pointer-events:none;
}


/* =====================================================
GOLD LINE
===================================================== */

.luxury-line{

    position:relative;

    z-index:2;

    width:100px;

    height:3px;

    margin:
    0 auto 12px;

    border-radius:20px;

    background:

    linear-gradient(
        90deg,
        #a97d17,
        #f1d36b,
        #b78b21
    );
}


/* =====================================================
LOGO
===================================================== */

.logo{

    position:relative;

    z-index:2;

    width:88px;

    height:88px;

    margin:
    0 auto 9px;

    padding:6px;

    border-radius:50%;

    background:#fff;

    border:
    3px solid #d6b13b;

    box-shadow:

    0 0 0 6px
    rgba(213,176,58,.08),

    0 11px 26px
    rgba(18,54,96,.17);
}

.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    border-radius:50%;
}


/* =====================================================
BIG SCHOOL NAME
===================================================== */

.school-name{

    position:relative;

    z-index:2;

    width:100%;

    text-align:center;

    white-space:nowrap;

    color:#0b3d91;

    font-size:
    clamp(31px,5.8vw,56px);

    line-height:1;

    font-weight:900;

    letter-spacing:1px;

    text-shadow:
    0 3px 10px
    rgba(11,61,145,.10);
}


.school-place{

    position:relative;

    z-index:2;

    text-align:center;

    margin-top:6px;

    color:#ad821b;

    font-size:11px;

    font-weight:800;

    letter-spacing:3px;
}


/* =====================================================
RESULT SECTION
===================================================== */

.result-panel{

    position:relative;

    z-index:2;

    width:min(
        940px,
        94%
    );

    margin:
    12px auto 0;

    padding:
    24px
    27px
    28px;

    border-radius:27px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #edf4fc
    );

    border:
    1px solid #d2dfed;

    box-shadow:

    0 18px 42px
    rgba(17,52,91,.13),

    inset 0 1px 0 #ffffff;

    overflow:hidden;
}


.result-panel::before{

    content:"";

    position:absolute;

    width:210px;

    height:210px;

    right:-120px;

    top:-120px;

    border-radius:50%;

    background:

    radial-gradient(
        circle,
        rgba(211,174,57,.10),
        transparent 68%
    );

    pointer-events:none;
}


/* =====================================================
RESULT GOLD LINE
===================================================== */

.result-heading-line{

    position:relative;

    z-index:2;

    width:75px;

    height:4px;

    margin:
    0 auto 10px;

    border-radius:20px;

    background:

    linear-gradient(
        90deg,
        #a97d17,
        #f1d36b,
        #b78b21
    );
}


/* =====================================================
DYNAMIC EXAM TITLE
===================================================== */

#examTitle{

    position:relative;

    z-index:2;

    margin:0 !important;

    text-align:center;

    color:#0b3d91 !important;

    font-size:
    clamp(
        23px,
        4.5vw,
        32px
    ) !important;

    line-height:1.15;

    font-weight:900 !important;

    text-shadow:none !important;
}


#sessionTitle{

    position:relative;

    z-index:2;

    margin:
    4px 0 0 !important;

    text-align:center;

    color:#71819a !important;

    font-size:14px;

    font-weight:600;
}


/* =====================================================
LIVE STATUS
===================================================== */

.live{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:7px;

    width:max-content;

    margin:
    9px auto 20px;

    padding:
    8px 20px;

    border-radius:50px;

    color:#fff;

    background:

    linear-gradient(
        180deg,
        #39cd96,
        #11885e
    );

    border:
    1px solid #8be2c0;

    font-size:10px;

    font-weight:800;

    box-shadow:

    0 8px 20px
    rgba(17,136,94,.20),

    inset 0 1px 1px
    rgba(255,255,255,.40);
}


.live::before{

    content:"";

    width:7px;

    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:
    0 0 0 4px
    rgba(255,255,255,.15);
}


/* =====================================================
FIELDS
===================================================== */

.result-form{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:20px;

    margin-top:2px;
}


.field label{

    display:block;

    margin-bottom:8px;

    color:#183b72;

    font-size:11px;

    font-weight:900;

    letter-spacing:.3px;
}


.field label i{

    color:#b88b20;

    margin-right:5px;
}


.result-input{

    width:100%;

    height:58px;

    padding:
    0 17px;

    border-radius:14px;

    border:
    1px solid #ccd9e8;

    outline:none;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #f4f7fb
    );

    color:#17345f;

    font-size:14px;

    font-weight:600;

    box-shadow:

    inset 0 2px 6px
    rgba(10,40,90,.04),

    0 5px 14px
    rgba(10,40,90,.04);

    transition:.25s;
}


.result-input:focus{

    border-color:#2c73d0;

    box-shadow:

    0 0 0 4px
    rgba(37,99,235,.08),

    0 8px 20px
    rgba(20,70,130,.08);
}


/* =====================================================
PREMIUM 3D VIEW RESULT
===================================================== */

.view-result-btn{

    position:relative;

    z-index:2;

    width:100%;

    height:64px;

    margin-top:22px;

    border:
    1px solid #83a9d7;

    border-radius:15px;

    cursor:pointer;

    color:#fff;

    font-size:15px;

    font-weight:900;

    letter-spacing:1.5px;

    background:

    linear-gradient(
        180deg,
        #5799e8 0%,
        #2368bc 48%,
        #0b3d91 100%
    );

    box-shadow:

    0 7px 0 #062d68,

    0 18px 34px
    rgba(11,61,145,.27),

    inset 0 2px 2px
    rgba(255,255,255,.42);

    transition:.15s;

    overflow:hidden;
}


.view-result-btn::before{

    content:"";

    position:absolute;

    left:10%;

    right:10%;

    top:5px;

    height:1px;

    background:
    rgba(255,255,255,.45);
}


.view-result-btn::after{

    content:"";

    position:absolute;

    top:0;

    left:-80%;

    width:55%;

    height:100%;

    background:

    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.20),
        transparent
    );

    transform:skewX(-20deg);

    transition:.7s;
}


.view-result-btn:hover::after{

    left:130%;
}


.view-result-btn:hover{

    transform:translateY(-3px);

    box-shadow:

    0 10px 0 #062d68,

    0 23px 40px
    rgba(11,61,145,.32),

    inset 0 2px 2px
    rgba(255,255,255,.45);
}


.view-result-btn:active{

    transform:translateY(5px);

    box-shadow:

    0 2px 0 #062d68,

    0 8px 15px
    rgba(11,61,145,.20);
}


/* =====================================================
RESULT OUTPUT
===================================================== */

#result:empty{

    display:none;
}

.result-card{

    width:min(
        940px,
        94%
    );

    margin:
    18px auto;

    padding:26px;

    border-radius:25px;

    background:#fff;

    border:
    1px solid #dce6f2;

    box-shadow:
    0 18px 40px
    rgba(10,40,90,.12);
}


/* =====================================================
LOGIN
===================================================== */

.login-container{

    width:min(
        940px,
        94%
    );

    margin:
    19px auto 0;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:16px;
}


.login-card{

    position:relative;

    padding:
    20px
    15px
    21px;

    text-align:center;

    border-radius:21px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #edf4fb
    );

    border:
    1px solid #d7e2ef;

    box-shadow:

    0 14px 30px
    rgba(13,46,83,.10),

    inset 0 1px 0 #fff;

    transition:.3s;

    overflow:hidden;
}


.login-card::before{

    content:"";

    position:absolute;

    left:0;

    right:0;

    top:0;

    height:3px;

    background:

    linear-gradient(
        90deg,
        #b58a20,
        #efd36b,
        #b58a20
    );
}


.login-card:hover{

    transform:translateY(-6px);

    box-shadow:

    0 23px 40px
    rgba(13,46,83,.16);
}


.login-icon{

    width:58px;

    height:58px;

    margin:
    0 auto 10px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:17px;

    color:#fff;

    font-size:23px;

    background:

    linear-gradient(
        145deg,
        #4c94e9,
        #0b3d91
    );

    border:
    1px solid #88addb;

    box-shadow:

    0 5px 0 #062d68,

    0 10px 21px
    rgba(11,61,145,.20);
}


.login-card h3{

    color:#12366e;

    font-size:15px;

    font-weight:800;
}


.login-card p{

    color:#8290a7;

    font-size:9px;

    margin-top:3px;
}


/* =====================================================
LOGIN 3D BUTTON
===================================================== */

.login-btn{

    position:relative;

    display:block;

    margin-top:12px;

    padding:11px 8px;

    text-decoration:none;

    text-align:center;

    color:#fff;

    border:
    1px solid #80a7d6;

    border-radius:10px;

    font-size:10px;

    font-weight:900;

    letter-spacing:.6px;

    background:

    linear-gradient(
        180deg,
        #5799e8,
        #2368bc 55%,
        #0b3d91
    );

    box-shadow:

    0 4px 0 #062d68,

    0 9px 17px
    rgba(11,61,145,.20),

    inset 0 1px 1px
    rgba(255,255,255,.35);

    transition:.15s;
}


.login-btn:hover{

    transform:translateY(-2px);

    filter:brightness(1.06);

    box-shadow:

    0 6px 0 #062d68,

    0 13px 22px
    rgba(11,61,145,.24);
}


.login-btn:active{

    transform:translateY(3px);

    box-shadow:

    0 1px 0 #062d68,

    0 5px 10px
    rgba(11,61,145,.18);
}


/* =====================================================
ANNOUNCEMENT
===================================================== */

.notice-section{

    width:min(
        940px,
        94%
    );

    margin:
    20px auto 0;

    padding:19px;

    border-radius:22px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #edf4fb
    );

    border:
    1px solid #d7e2ef;

    box-shadow:

    0 15px 32px
    rgba(13,46,83,.09);
}


.notice-title-wrap{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin-bottom:11px;
}


.notice-title-wrap::before,
.notice-title-wrap::after{

    content:"";

    width:55px;

    height:1px;

    background:

    linear-gradient(
        90deg,
        transparent,
        #c49a2d
    );
}


.notice-title-wrap::after{

    background:

    linear-gradient(
        90deg,
        #c49a2d,
        transparent
    );
}


.notice-title{

    color:#12386f;

    font-size:16px;

    font-weight:900;

    letter-spacing:.5px;
}


.notice-inner{

    padding:9px;

    border-radius:12px;

    background:

    linear-gradient(
        145deg,
        #f9fbfe,
        #edf3f9
    );

    border:
    1px solid #d8e3ef;
}


.notice-inner marquee{

    display:block;

    padding:12px;

    min-height:42px;

    border-radius:9px;

    background:#fff;

    border:
    1px solid #e0d3a5;

    color:#a32121;

    font-size:13px;

    line-height:1.4;

    font-weight:900;

    letter-spacing:.1px;
}


#countdown{

    margin-top:9px !important;

    text-align:center;

    color:#0b3d91;

    font-size:11px !important;

    font-weight:800;
}


/* =====================================================
FOOTER
===================================================== */

.footer{

    width:100%;

    margin-top:25px;

    padding:
    15px 10px;

    text-align:center;

    color:#fff;

    background:

    linear-gradient(
        135deg,
        #0b3d91,
        #082f70
    );

    border-top:
    2px solid #d5b143;
}


.footer .developer{

    margin:0;

    font-size:11px;

    font-weight:600;
}


.footer strong{

    color:#f4d56d;
}


/* =====================================================
WHATSAPP
===================================================== */

.whatsapp-btn{

    position:fixed;

    right:17px;

    bottom:17px;

    width:53px;

    height:53px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    color:#fff;

    background:#25D366;

    text-decoration:none;

    font-size:25px;

    box-shadow:

    0 5px 0 #159947,

    0 12px 24px
    rgba(37,211,102,.28);

    z-index:999;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:700px){

    .school-card{

        padding:
        20px 10px 22px;
    }


    .logo{

        width:76px;

        height:76px;
    }


    .school-name{

        font-size:
        clamp(
            24px,
            7.5vw,
            30px
        );

        letter-spacing:
        .2px;

        white-space:nowrap;
    }


    .school-place{

        font-size:9px;

        letter-spacing:2px;

        margin-top:5px;
    }


    .result-panel{

        width:96%;

        margin-top:10px;

        padding:
        21px 12px 23px;

        border-radius:21px;
    }


    #examTitle{

        font-size:
        clamp(
            20px,
            6vw,
            25px
        ) !important;
    }


    #sessionTitle{

        font-size:10px;
    }


    .live{

        margin:
        8px auto 15px;

        padding:
        7px 16px;

        font-size:9px;
    }


    .result-form{

        grid-template-columns:
        1fr 1fr;

        gap:9px;
    }


    .field label{

        font-size:8px;

        white-space:nowrap;
    }


    .result-input{

        height:51px;

        padding:
        0 10px;

        font-size:10px;
    }


    .view-result-btn{

        height:58px;

        margin-top:16px;

        font-size:12px;

        letter-spacing:1px;
    }


    .login-container{

        width:96%;

        grid-template-columns:
        repeat(3,1fr);

        gap:7px;

        margin-top:14px;
    }


    .login-card{

        padding:
        14px 4px 15px;

        border-radius:15px;
    }


    .login-icon{

        width:41px;

        height:41px;

        border-radius:11px;

        font-size:16px;

        margin-bottom:7px;
    }


    .login-card h3{

        font-size:8px;
    }


    .login-card p{

        display:none;
    }


    .login-btn{

        margin-top:7px;

        padding:8px 2px;

        font-size:7px;
    }


    .notice-section{

        width:96%;

        margin-top:14px;

        padding:13px;

        border-radius:17px;
    }


    .notice-title{

        font-size:11px;
    }


    .notice-title-wrap::before,
    .notice-title-wrap::after{

        width:25px;
    }


    .notice-inner{

        padding:6px;
    }


    .notice-inner marquee{

        padding:9px;

        min-height:38px;

        font-size:10px;

        font-weight:900;
    }


    .footer{

        margin-top:16px;

        padding:10px;
    }


    .footer .developer{

        font-size:8px;
    }


    .whatsapp-btn{

        width:47px;

        height:47px;

        right:13px;

        bottom:13px;

        font-size:22px;
    }

}


/* =====================================================
VERY SMALL MOBILE
===================================================== */

@media(max-width:380px){

    .school-name{

        font-size:
        22px;

        letter-spacing:0;
    }


    .logo{

        width:64px;

        height:64px;
    }


    #examTitle{

        font-size:18px !important;
    }


    .result-title{

        font-size:18px;
    }


    .result-form{

        gap:7px;
    }


    .result-input{

        height:48px;

        font-size:9px;
    }


    .view-result-btn{

        height:54px;

        font-size:11px;
    }


    .login-card h3{

        font-size:7px;
    }


    .login-btn{

        font-size:6.5px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
PREMIUM IMAGE
===================================================== -->

<section class="hero-image">

<img
src="premium-students.jpg"
alt="IPS PUBLIC SCHOOL Students">

</section>



<!-- =====================================================
MAIN
===================================================== -->

<div class="main-container">


<!-- =====================================================
SCHOOL BRANDING
===================================================== -->

<section class="school-card">


<div class="luxury-line"></div>


<!-- LOGO -->

<div class="logo">

<img
src="logo.png"
alt="IPS PUBLIC SCHOOL Logo">

</div>


<!-- SCHOOL NAME -->

<h1 class="school-name">

IPS PUBLIC SCHOOL

</h1>


<!-- LOCATION -->

<p class="school-place">

AHIRORI • HARDOI

</p>



<!-- =====================================================
RESULT SECTION STARTS IMMEDIATELY
===================================================== -->

<div class="result-panel">


<div class="result-heading-line"></div>


<!-- DYNAMIC EXAM TITLE -->

<h2
id="examTitle">

Loading...

</h2>


<!-- DYNAMIC SESSION -->

<h3
id="sessionTitle">

Loading...

</h3>


<!-- DYNAMIC LIVE STATUS -->

<div
class="live"
id="resultLive">

Loading...

</div>



<!-- CLASS + ROLL -->

<div class="result-form">


<div class="field">


<label>

<i class="fa-solid fa-graduation-cap"></i>

SELECT CLASS

</label>


<select
class="result-input"
id="class">

<option
selected
disabled>

Select Class

</option>

<option>Class 3</option>

<option>Class 4</option>

<option>Class 5</option>

<option>Class 6</option>

<option>Class 7</option>

<option>Class 8</option>

</select>


</div>



<div class="field">


<label>

<i class="fa-solid fa-hashtag"></i>

ROLL NUMBER

</label>


<input
type="number"
id="roll"
class="result-input"
placeholder="Enter Roll Number">


</div>


</div>



<!-- PREMIUM RESULT BUTTON -->

<button
