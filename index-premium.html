<style>

/* =====================================================
GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(37,99,235,.08),
        transparent 28%
    ),
    radial-gradient(
        circle at 90% 35%,
        rgba(212,175,55,.08),
        transparent 30%
    ),
    #f4f7fc;

    color:#10234f;

    overflow-x:hidden;
}


/* =====================================================
CLEAN HERO IMAGE
===================================================== */

.hero-image{

    width:100%;

    height:420px;

    position:relative;

    overflow:hidden;

    background:#eaf0f8;
}


.hero-image img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    /* IMAGE CLEAR + LIGHT */

    opacity:.98;

    filter:
    brightness(1.08)
    saturate(.92)
    contrast(.96);

}


/* =====================================================
SCHOOL PREMIUM HEADER
===================================================== */

.school-header{

    width:min(1050px,94%);

    margin:-25px auto 0;

    position:relative;

    z-index:10;

    text-align:center;

    padding:32px 20px 28px;

    border-radius:30px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f0f5ff
    );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:

    0 22px 55px rgba(10,40,90,.17),

    inset 0 1px 0 #fff;
}


/* GOLD LINE */

.gold-line{

    width:90px;

    height:5px;

    margin:0 auto 15px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #c5971e,
        #f5d66a,
        #c5971e
    );

    box-shadow:
    0 4px 12px rgba(212,175,55,.28);
}


/* LOGO */

.logo{

    width:90px;

    height:90px;

    margin:0 auto 13px;

    padding:6px;

    border-radius:50%;

    background:#fff;

    border:3px solid #e5bd42;

    box-shadow:

    0 0 0 6px rgba(255,215,0,.10),

    0 12px 30px rgba(10,40,90,.20);
}


.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    border-radius:50%;
}


/* SCHOOL NAME */

.school-name{

    color:#0b3d91;

    font-size:clamp(
        30px,
        6vw,
        52px
    );

    line-height:1.05;

    font-weight:900;

    letter-spacing:1.5px;

    text-shadow:

    0 3px 10px rgba(11,61,145,.12);
}


/* PLACE */

.school-place{

    margin-top:7px;

    color:#b78a18;

    font-size:15px;

    font-weight:800;

    letter-spacing:3px;
}


/* EXAM */

#examTitle{

    margin-top:15px !important;

    color:#172e61 !important;

    font-size:clamp(
        21px,
        4vw,
        32px
    ) !important;

    font-weight:800 !important;

    text-shadow:none !important;
}


/* SESSION */

#sessionTitle{

    margin-top:4px !important;

    color:#68799a !important;

    font-size:15px;

    font-weight:600;
}


/* =====================================================
LIVE STATUS
===================================================== */

.live{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    margin-top:13px;

    padding:9px 22px;

    border-radius:50px;

    color:#fff;

    font-size:13px;

    font-weight:800;

    background:

    linear-gradient(
        180deg,
        #35d69b,
        #119669
    );

    border:1px solid rgba(255,255,255,.7);

    box-shadow:

    inset 0 2px 2px rgba(255,255,255,.4),

    0 9px 22px rgba(16,185,129,.30);
}


.live::before{

    content:"";

    width:8px;

    height:8px;

    border-radius:50%;

    background:#fff;

    box-shadow:

    0 0 0 5px rgba(255,255,255,.17);
}


/* =====================================================
MAIN
===================================================== */

.main-wrap{

    padding-top:28px;

    padding-bottom:30px;
}


/* =====================================================
BIG PREMIUM RESULT
===================================================== */

.result-search-section{

    width:min(1000px,92%);

    margin:0 auto 35px;
}


.result-search-card{

    position:relative;

    padding:42px 45px 46px;

    border-radius:34px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #eef4ff
    );

    border:1px solid #fff;

    box-shadow:

    0 25px 65px rgba(8,35,83,.18),

    inset 0 1px 0 #fff;

    overflow:hidden;
}


.result-search-card::before{

    content:"";

    position:absolute;

    width:300px;

    height:300px;

    right:-140px;

    top:-170px;

    border-radius:50%;

    background:
    rgba(37,99,235,.07);
}


.result-search-card::after{

    content:"";

    position:absolute;

    width:250px;

    height:250px;

    left:-120px;

    bottom:-170px;

    border-radius:50%;

    background:
    rgba(212,175,55,.08);
}


/* RESULT HEADER */

.gold-line-result{

    position:relative;

    z-index:2;

    width:100px;

    height:5px;

    margin:0 auto 16px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #c4971f,
        #f5d66a,
        #c4971f
    );
}


.result-heading{

    position:relative;

    z-index:2;

    text-align:center;

    color:#0b3d91;

    font-size:32px;

    font-weight:900;
}


.result-subtitle{

    position:relative;

    z-index:2;

    text-align:center;

    color:#71809b;

    font-size:14px;

    margin-top:5px;

    margin-bottom:30px;
}


/* FORM */

.result-form{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:20px;
}


.result-field label{

    display:block;

    margin-bottom:9px;

    color:#19376e;

    font-size:13px;

    font-weight:800;
}


.result-field label i{

    color:#c49a25;

    margin-right:5px;
}


.result-input{

    width:100%;

    height:58px;

    padding:0 17px;

    border:2px solid #e0e8f5;

    border-radius:16px;

    outline:none;

    background:#fff;

    color:#172b52;

    font-size:15px;

    font-weight:500;

    box-shadow:

    inset 0 3px 7px rgba(10,40,90,.05),

    0 5px 15px rgba(10,40,90,.05);

    transition:.25s;
}


.result-input:focus{

    border-color:#2875df;

    box-shadow:

    0 0 0 4px rgba(37,99,235,.10),

    0 7px 18px rgba(37,99,235,.08);
}


/* =====================================================
3D RESULT BUTTON
===================================================== */

.result-button-wrap{

    position:relative;

    z-index:2;

    margin-top:24px;
}


.view-result-btn{

    width:100%;

    height:63px;

    border:none;

    border-radius:17px;

    cursor:pointer;

    color:#fff;

    font-size:17px;

    font-weight:800;

    letter-spacing:1.2px;

    background:

    linear-gradient(
        180deg,
        #4196ff 0%,
        #1262cb 48%,
        #0a3f91 100%
    );

    box-shadow:

    0 7px 0 #062e70,

    0 18px 32px rgba(11,61,145,.35),

    inset 0 2px 2px rgba(255,255,255,.45),

    inset 0 -4px 7px rgba(0,0,0,.12);

    transition:.15s;
}


.view-result-btn:hover{

    transform:translateY(-3px);

    filter:brightness(1.06);

    box-shadow:

    0 9px 0 #062e70,

    0 23px 38px rgba(11,61,145,.38),

    inset 0 2px 2px rgba(255,255,255,.45);
}


.view-result-btn:active{

    transform:translateY(5px);

    box-shadow:

    0 2px 0 #062e70,

    0 8px 15px rgba(11,61,145,.25);
}


/* =====================================================
LOGIN
===================================================== */

.login-container{

    width:min(1100px,94%);

    margin:0 auto;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;
}


.login-card{

    min-height:205px;

    padding:25px 20px 22px;

    text-align:center;

    border-radius:25px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #eef4ff
    );

    border:1px solid #fff;

    box-shadow:

    0 17px 38px rgba(13,43,90,.14),

    inset 0 1px 0 #fff;

    transition:.25s;
}


.login-card:hover{

    transform:translateY(-8px);

    box-shadow:

    0 27px 48px rgba(13,43,90,.20);
}


.login-card i{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:67px;

    height:67px;

    border-radius:19px;

    color:#fff;

    font-size:29px;

    background:

    linear-gradient(
        145deg,
        #3b8cff,
        #0b3d91
    );

    box-shadow:

    0 6px 0 #072e6d,

    0 13px 24px rgba(11,61,145,.30);
}


.login-card h3{

    margin-top:16px;

    color:#102b61;

    font-size:19px;

    font-weight:800;
}


.login-btn{

    display:block;

    text-decoration:none;

    padding:12px;

    margin-top:15px;

    border-radius:14px;

    color:#fff;

    font-size:14px;

    font-weight:800;

    background:

    linear-gradient(
        180deg,
        #3b8cff,
        #0b3d91
    );

    box-shadow:

    0 5px 0 #062e70,

    0 10px 20px rgba(11,61,145,.25);

    transition:.15s;
}


.login-btn:hover{

    transform:translateY(-2px);
}


.login-btn:active{

    transform:translateY(3px);

    box-shadow:

    0 2px 0 #062e70;
}


/* =====================================================
NOTICE
===================================================== */

.notice-section{

    width:min(1050px,94%);

    margin:30px auto 0;

    padding:23px;

    border-radius:25px;

    background:#fff;

    border:1px solid #e1e9f6;

    box-shadow:

    0 15px 38px rgba(13,43,90,.11);
}


.notice-section h2{

    text-align:center;

    color:#102b61;

    font-size:21px;

    font-weight:800;

    margin-bottom:14px;
}


.notice-section marquee{

    padding:14px;

    border-radius:14px;

    color:#b32727;

    background:#fff7f7;

    border:1px solid #f3d5d5;

    font-size:14px;

    font-weight:600;
}


#countdown{

    margin-top:15px;

    font-size:15px !important;

    font-weight:700;

    color:#0b3d91;

    text-align:center;
}


/* =====================================================
RESULT OUTPUT
===================================================== */

#result:empty{

    display:none;
}


.result-card{

    width:min(1050px,94%);

    margin:30px auto;

    padding:28px;

    border-radius:30px;

    background:

    linear-gradient(
        145deg,
        #fff,
        #f5f9ff
    );

    border:1px solid #dfe8f7;

    box-shadow:

    0 22px 55px rgba(13,43,90,.17);
}


.result-header{

    text-align:center;

    margin-bottom:20px;
}


.result-header h2{

    color:#0b3d91;

    font-weight:900;
}


.info-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:13px;

    margin:20px 0;
}


.info-box{

    padding:15px;

    border-radius:15px;

    background:#eef4ff;

    color:#19376e;

    font-weight:700;

    text-align:center;
}


.resultTable{

    width:100%;

    border-collapse:separate;

    border-spacing:0;

    margin-top:20px;
}


.resultTable th{

    background:#0b3d91;

    color:#fff;

    padding:13px;
}


.resultTable td{

    padding:11px;

    border-bottom:1px solid #e5eaf2;

    text-align:center;
}


.summary{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));

    gap:13px;

    margin-top:20px;
}


.summary div{

    padding:16px;

    border-radius:15px;

    text-align:center;

    background:#edf4ff;

    font-weight:700;
}


.pass{

    background:#dff6e7 !important;

    color:#11733e;
}


.fail{

    background:#fde4e5 !important;

    color:#b4232c;
}


.result-card button{

    width:100%;

    padding:15px;

    margin-top:20px;

    border:none;

    border-radius:15px;

    background:#0b3d91;

    color:#fff;

    font-size:16px;

    font-weight:800;

    cursor:pointer;
}


/* =====================================================
FOOTER
===================================================== */

.footer{

    margin-top:30px;

    padding:18px 15px;

    text-align:center;

    color:#fff;

    background:

    linear-gradient(
        135deg,
        #061b43,
        #0b3d91
    );

    border-top:2px solid #d9b43b;
}


.footer .developer{

    margin:0;

    font-size:14px;

    font-weight:600;
}


.footer strong{

    color:#f5d36a;
}


/* =====================================================
TOP BUTTON
===================================================== */

#topBtn{

    display:none;

    position:fixed;

    right:18px;

    bottom:20px;

    width:53px;

    height:53px;

    border:none;

    border-radius:50%;

    color:#fff;

    background:

    linear-gradient(
        145deg,
        #2476df,
        #0b3d91
    );

    font-size:21px;

    cursor:pointer;

    box-shadow:

    0 6px 0 #062e6b,

    0 12px 24px rgba(11,61,145,.35);

    z-index:999;
}


/* =====================================================
WHATSAPP
===================================================== */

.whatsapp-btn{

    position:fixed;

    right:18px;

    bottom:83px;

    width:58px;

    height:58px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff;

    background:#25D366;

    text-decoration:none;

    font-size:27px;

    box-shadow:

    0 6px 0 #169b49,

    0 12px 24px rgba(37,211,102,.35);

    z-index:999;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:720px){

    .hero-image{

        height:260px;
    }


    .school-header{

        width:94%;

        margin:-18px auto 0;

        padding:27px 15px 25px;

        border-radius:25px;
    }


    .logo{

        width:78px;

        height:78px;
    }


    .school-name{

        font-size:30px;

        letter-spacing:1px;
    }


    .school-place{

        font-size:12px;

        letter-spacing:2px;
    }


    #examTitle{

        font-size:22px !important;
    }


    .main-wrap{

        padding-top:23px;
    }


    .result-search-section{

        width:94%;
    }


    .result-search-card{

        padding:30px 18px 34px;

        border-radius:27px;
    }


    .result-heading{

        font-size:25px;
    }


    .result-subtitle{

        font-size:13px;

        margin-bottom:22px;
    }


    .result-form{

        grid-template-columns:1fr;

        gap:0;
    }


    .result-input{

        height:55px;
    }


    .view-result-btn{

        height:59px;

        font-size:15px;
    }


    .login-container{

        width:90%;

        grid-template-columns:1fr;

        gap:14px;
    }


    .login-card{

        min-height:auto;

        padding:21px;
    }


    .login-btn{

        max-width:280px;

        margin:14px auto 0;
    }


    .notice-section{

        padding:18px;
    }


    .notice-section h2{

        font-size:18px;
    }


    .result-card{

        padding:18px;
    }

}


/* =====================================================
SAFE AREA
===================================================== */

@supports(padding:env(safe-area-inset-top)){

    body{

        padding-top:env(safe-area-inset-top);

        padding-bottom:env(safe-area-inset-bottom);

    }

}

</style>

</head>

<!-- =====================================================
TOP BUTTON SCRIPT
===================================================== -->

<script>

const topBtn =
document.getElementById("topBtn");


window.onscroll=function(){

    if(
        document.body.scrollTop > 200 ||
        document.documentElement.scrollTop > 200
    ){

        topBtn.style.display="flex";

    }

    else{

        topBtn.style.display="none";

    }

};

</script>
