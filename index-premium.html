<style>

/* =========================================================
GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(37,99,235,.10),
        transparent 28%
    ),

    radial-gradient(
        circle at 90% 35%,
        rgba(212,175,55,.10),
        transparent 30%
    ),

    #f3f7ff;

    color:#10234f;

    overflow-x:hidden;
}


/* =========================================================
HERO IMAGE
========================================================= */

.hero{

    min-height:570px;

    position:relative;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:25px 15px 70px;

    background:

    linear-gradient(
        180deg,
        rgba(3,19,50,.18),
        rgba(3,19,50,.62)
    ),

    url("hero-bg.jpg");

    background-size:cover;

    background-position:center;
}


.hero::before{

    content:"";

    position:absolute;

    inset:0;

    background:

    radial-gradient(
        circle at 50% 10%,
        rgba(255,255,255,.25),
        transparent 25%
    );
}


.hero::after{

    content:"";

    position:absolute;

    left:-5%;

    right:-5%;

    bottom:-60px;

    height:110px;

    background:#f3f7ff;

    border-radius:50% 50% 0 0;

    z-index:3;
}


.hero-content{

    position:relative;

    z-index:5;

    width:min(900px,100%);
}


/* =========================================================
LOGO
========================================================= */

.logo{

    width:112px;

    height:112px;

    margin:0 auto 15px;

    padding:7px;

    border-radius:50%;

    background:#fff;

    border:3px solid #e7c34f;

    box-shadow:

    0 0 0 7px rgba(255,215,0,.14),

    0 18px 50px rgba(0,0,0,.38);
}


.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    border-radius:50%;
}


/* =========================================================
SCHOOL TITLE
========================================================= */

.hero h1{

    color:#fff;

    font-size:clamp(
        32px,
        6vw,
        60px
    );

    line-height:1;

    font-weight:900;

    letter-spacing:2px;

    text-shadow:

    0 5px 22px rgba(0,0,0,.55);
}


.hero p{

    margin-top:10px;

    color:#f5d36a;

    font-size:clamp(
        13px,
        2vw,
        18px
    );

    font-weight:700;

    letter-spacing:3px;
}


#examTitle{

    margin-top:16px !important;

    color:#fff !important;

    font-size:clamp(
        22px,
        4vw,
        35px
    ) !important;

    font-weight:800 !important;

    text-shadow:

    0 3px 17px rgba(0,0,0,.75) !important;
}


#sessionTitle{

    margin-top:5px !important;

    color:rgba(255,255,255,.92) !important;

    font-size:15px;
}


/* =========================================================
LIVE
========================================================= */

.live{

    display:inline-flex;

    align-items:center;

    gap:9px;

    margin-top:15px;

    padding:9px 23px;

    border-radius:50px;

    color:#fff;

    font-size:13px;

    font-weight:800;

    background:

    linear-gradient(
        180deg,
        #34d399,
        #119669
    );

    border:1px solid rgba(255,255,255,.6);

    box-shadow:

    inset 0 2px 2px rgba(255,255,255,.4),

    0 9px 25px rgba(16,185,129,.40);
}


.live::before{

    content:"";

    width:9px;

    height:9px;

    border-radius:50%;

    background:#fff;

    box-shadow:

    0 0 0 5px rgba(255,255,255,.18);
}


/* =========================================================
MAIN AREA
========================================================= */

.main-wrap{

    position:relative;

    z-index:5;

    margin-top:0;

    padding-top:15px;

    padding-bottom:25px;
}


/* =========================================================
PREMIUM RESULT SECTION
========================================================= */

.result-search-section{

    width:min(1000px,92%);

    margin:0 auto 35px;

    position:relative;

}


.result-search-card{

    position:relative;

    padding:40px 42px 45px;

    border-radius:34px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #eef4ff
    );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:

    0 25px 65px rgba(8,35,83,.18),

    0 5px 0 rgba(8,35,83,.05),

    inset 0 1px 0 #ffffff;

    overflow:hidden;
}


.result-search-card::before{

    content:"";

    position:absolute;

    width:260px;

    height:260px;

    border-radius:50%;

    top:-150px;

    right:-100px;

    background:

    rgba(37,99,235,.08);
}


.result-search-card::after{

    content:"";

    position:absolute;

    width:230px;

    height:230px;

    border-radius:50%;

    bottom:-160px;

    left:-90px;

    background:

    rgba(212,175,55,.09);
}


/* GOLD TOP LINE */

.gold-line{

    width:100px;

    height:5px;

    margin:0 auto 17px;

    border-radius:20px;

    background:

    linear-gradient(
        90deg,
        #c79820,
        #f5d66a,
        #c79820
    );

    box-shadow:

    0 4px 10px rgba(212,175,55,.25);
}


.result-heading{

    position:relative;

    z-index:2;

    text-align:center;

    color:#0b3d91;

    font-size:32px;

    font-weight:900;

    letter-spacing:.5px;
}


.result-subtitle{

    position:relative;

    z-index:2;

    text-align:center;

    color:#68799a;

    font-size:14px;

    margin-top:5px;

    margin-bottom:28px;
}


/* RESULT FORM */

.result-form{

    position:relative;

    z-index:2;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:18px;

}


.result-field{

    position:relative;
}


.result-field label{

    display:block;

    margin-bottom:8px;

    color:#19376e;

    font-size:13px;

    font-weight:700;

}


.result-field label i{

    color:#d2a52b;

    margin-right:5px;
}


.result-input{

    width:100%;

    height:57px;

    padding:0 17px;

    border:2px solid #e0e8f5;

    border-radius:16px;

    outline:none;

    background:#fff;

    color:#172b52;

    font-size:15px;

    font-weight:500;

    box-shadow:

    inset 0 3px 7px rgba(10,40,90,.05),

    0 5px 15px rgba(10,40,90,.05);

    transition:.25s;
}


.result-input:focus{

    border-color:#2673df;

    box-shadow:

    0 0 0 4px rgba(37,99,235,.10),

    0 7px 18px rgba(37,99,235,.08);
}


/* =========================================================
3D VIEW RESULT BUTTON
========================================================= */

.result-button-wrap{

    position:relative;

    z-index:2;

    margin-top:23px;
}


.view-result-btn{

    width:100%;

    height:62px;

    border:none;

    border-radius:17px;

    cursor:pointer;

    color:#fff;

    font-size:17px;

    font-weight:800;

    letter-spacing:1.2px;

    background:

    linear-gradient(
        180deg,
        #3d91ff 0%,
        #1260c9 48%,
        #0a3f91 100%
    );

    box-shadow:

    0 7px 0 #062e70,

    0 17px 30px rgba(11,61,145,.35),

    inset 0 2px 2px rgba(255,255,255,.42),

    inset 0 -3px 6px rgba(0,0,0,.13);

    transition:.15s ease;

}


.view-result-btn:hover{

    transform:translateY(-3px);

    filter:brightness(1.06);

    box-shadow:

    0 9px 0 #062e70,

    0 22px 35px rgba(11,61,145,.38),

    inset 0 2px 2px rgba(255,255,255,.45);
}


.view-result-btn:active{

    transform:translateY(5px);

    box-shadow:

    0 2px 0 #062e70,

    0 8px 15px rgba(11,61,145,.25);
}


/* =========================================================
LOGIN CARDS
========================================================= */

.login-container{

    width:min(1100px,94%);

    margin:0 auto;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;
}


.login-card{

    position:relative;

    overflow:hidden;

    min-height:205px;

    padding:25px 20px 22px;

    text-align:center;

    border-radius:25px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #eef4ff
    );

    border:1px solid #fff;

    box-shadow:

    0 17px 38px rgba(13,43,90,.14),

    inset 0 1px 0 #fff;

    transition:.25s;
}


.login-card:hover{

    transform:translateY(-8px);

    box-shadow:

    0 27px 48px rgba(13,43,90,.20);
}


.login-card i{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:67px;

    height:67px;

    border-radius:19px;

    color:#fff;

    font-size:29px;

    background:

    linear-gradient(
        145deg,
        #3b8cff,
        #0b3d91
    );

    box-shadow:

    0 6px 0 #072e6d,

    0 13px 24px rgba(11,61,145,.30);
}


.login-card h3{

    margin-top:16px;

    color:#102b61;

    font-size:19px;

    font-weight:800;
}


.login-btn{

    display:block;

    text-decoration:none;

    padding:12px;

    margin-top:15px;

    border-radius:14px;

    color:#fff;

    font-size:14px;

    font-weight:800;

    background:

    linear-gradient(
        180deg,
        #3b8cff,
        #0b3d91
    );

    box-shadow:

    0 5px 0 #062e70,

    0 10px 20px rgba(11,61,145,.25);

    transition:.15s;
}


.login-btn:hover{

    transform:translateY(-2px);
}


.login-btn:active{

    transform:translateY(3px);

    box-shadow:

    0 2px 0 #062e70;
}


/* =========================================================
NOTICE
========================================================= */

.notice-section{

    width:min(1050px,94%);

    margin:30px auto 0;

    padding:23px;

    border-radius:25px;

    background:#fff;

    border:1px solid #e1e9f6;

    box-shadow:

    0 15px 38px rgba(13,43,90,.11);
}


.notice-section h2{

    text-align:center;

    color:#102b61;

    font-size:21px;

    font-weight:800;

    margin-bottom:14px;
}


.notice-section marquee{

    padding:14px;

    border-radius:14px;

    color:#b32727;

    background:#fff7f7;

    border:1px solid #f3d5d5;

    font-size:14px;

    font-weight:600;
}


#countdown{

    margin-top:15px;

    font-size:15px !important;

    font-weight:700;

    color:#0b3d91;

    text-align:center;
}


/* =========================================================
RESULT DISPLAY
========================================================= */

#result:empty{

    display:none;
}


.result-card{

    width:min(1050px,94%);

    margin:30px auto;

    padding:28px;

    border-radius:30px;

    background:

    linear-gradient(
        145deg,
        #fff,
        #f5f9ff
    );

    border:1px solid #dfe8f7;

    box-shadow:

    0 22px 55px rgba(13,43,90,.17);
}


.result-header{

    text-align:center;

    margin-bottom:20px;
}


.result-header h2{

    color:#0b3d91;

    font-weight:900;
}


.info-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:13px;

    margin:20px 0;
}


.info-box{

    padding:15px;

    border-radius:15px;

    background:#eef4ff;

    color:#19376e;

    font-weight:700;

    text-align:center;
}


.resultTable{

    width:100%;

    border-collapse:separate;

    border-spacing:0;

    margin-top:20px;
}


.resultTable th{

    background:#0b3d91;

    color:#fff;

    padding:13px;
}


.resultTable td{

    padding:11px;

    border-bottom:1px solid #e5eaf2;

    text-align:center;
}


.summary{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));

    gap:13px;

    margin-top:20px;
}


.summary div{

    padding:16px;

    border-radius:15px;

    text-align:center;

    background:#edf4ff;

    font-weight:700;
}


.pass{

    background:#dff6e7 !important;

    color:#11733e;
}


.fail{

    background:#fde4e5 !important;

    color:#b4232c;
}


.result-card button{

    width:100%;

    padding:15px;

    margin-top:20px;

    border:none;

    border-radius:15px;

    background:#0b3d91;

    color:#fff;

    font-size:16px;

    font-weight:800;

    cursor:pointer;
}


/* =========================================================
FOOTER
========================================================= */

.footer{

    margin-top:30px;

    padding:18px 15px;

    text-align:center;

    color:#fff;

    background:

    linear-gradient(
        135deg,
        #061b43,
        #0b3d91
    );

    border-top:2px solid #d9b43b;
}


.footer .developer{

    margin:0;

    font-size:14px;

    font-weight:600;
}


.footer strong{

    color:#f5d36a;
}


/* =========================================================
TOP BUTTON
========================================================= */

#topBtn{

    display:none;

    position:fixed;

    right:18px;

    bottom:20px;

    width:53px;

    height:53px;

    border:none;

    border-radius:50%;

    color:#fff;

    background:

    linear-gradient(
        145deg,
        #2476df,
        #0b3d91
    );

    font-size:21px;

    cursor:pointer;

    box-shadow:

    0 6px 0 #062e6b,

    0 12px 24px rgba(11,61,145,.35);

    z-index:999;
}


/* =========================================================
WHATSAPP
========================================================= */

.whatsapp-btn{

    position:fixed;

    right:18px;

    bottom:83px;

    width:58px;

    height:58px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff;

    background:#25D366;

    text-decoration:none;

    font-size:27px;

    box-shadow:

    0 6px 0 #169b49,

    0 12px 24px rgba(37,211,102,.35);

    z-index:999;
}


/* =========================================================
MOBILE
========================================================= */

@media(max-width:720px){

    .hero{

        min-height:520px;

        padding-top:22px;

    }


    .logo{

        width:92px;

        height:92px;

    }


    .hero h1{

        letter-spacing:1px;

    }


    .hero p{

        letter-spacing:2px;

    }


    .main-wrap{

        padding-top:5px;

    }


    .result-search-section{

        width:94%;

    }


    .result-search-card{

        padding:28px 19px 32px;

        border-radius:26px;

    }


    .result-heading{

        font-size:25px;

    }


    .result-subtitle{

        font-size:13px;

        margin-bottom:22px;

    }


    .result-form{

        grid-template-columns:1fr;

        gap:0;

    }


    .result-input{

        height:55px;

    }


    .view-result-btn{

        height:59px;

        font-size:15px;

    }


    .login-container{

        width:90%;

        grid-template-columns:1fr;

        gap:14px;

    }


    .login-card{

        min-height:auto;

        padding:21px;

    }


    .login-btn{

        max-width:280px;

        margin:14px auto 0;

    }


    .notice-section{

        padding:18px;

    }


    .notice-section h2{

        font-size:18px;

    }


    .result-card{

        padding:18px;

    }

}


/* =========================================================
SAFE AREA
========================================================= */

@supports(padding:env(safe-area-inset-top)){

    body{

        padding-top:env(safe-area-inset-top);

        padding-bottom:env(safe-area-inset-bottom);

    }

}

</style>

</head>

<!-- =========================================================
TOP BUTTON SCRIPT
========================================================= -->

<script>

const topBtn =
document.getElementById("topBtn");


window.onscroll=function(){

    if(
        document.body.scrollTop > 200 ||
        document.documentElement.scrollTop > 200
    ){

        topBtn.style.display="flex";

    }

    else{

        topBtn.style.display="none";

    }

};

</script>
