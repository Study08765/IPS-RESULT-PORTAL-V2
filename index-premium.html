<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ================= PWA ================= -->
<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#071d49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="application-name" content="IPSPS PORTAL">
<meta name="apple-mobile-web-app-title" content="IPSPS">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>IPSPS PORTAL - IPS PUBLIC SCHOOL</title>

<!-- ================= GOOGLE FONT ================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- ================= FONT AWESOME ================= -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 10% 10%,rgba(37,99,235,.10),transparent 28%),
    radial-gradient(circle at 90% 35%,rgba(212,175,55,.10),transparent 30%),
    #f4f7fc;
    color:#10234f;
    overflow-x:hidden;
}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:650px;

    position:relative;

    overflow:hidden;

    display:flex;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:30px 16px 80px;

    background:
    linear-gradient(
        180deg,
        rgba(3,19,50,.20),
        rgba(3,19,50,.62)
    ),
    url("hero-bg.jpg");

    background-size:cover;

    background-position:center;
}


.hero::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    radial-gradient(
        circle at 50% 10%,
        rgba(255,255,255,.25),
        transparent 25%
    );

}


.hero::after{

    content:"";

    position:absolute;

    left:-5%;

    right:-5%;

    bottom:-60px;

    height:120px;

    background:#f4f7fc;

    border-radius:50% 50% 0 0;

    z-index:3;
}


.hero-content{

    width:min(100%,850px);

    position:relative;

    z-index:5;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:115px;

    height:115px;

    margin:0 auto 15px;

    padding:7px;

    border-radius:50%;

    background:#fff;

    border:3px solid #e5bd42;

    box-shadow:

    0 0 0 7px rgba(255,215,0,.13),

    0 18px 45px rgba(0,0,0,.35);

}


.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    border-radius:50%;

}


/* =====================================================
   SCHOOL TITLE
===================================================== */

.hero h1{

    font-size:clamp(32px,6vw,60px);

    line-height:1.05;

    font-weight:900;

    letter-spacing:2px;

    color:#fff;

    text-shadow:

    0 4px 20px rgba(0,0,0,.55);

}


.hero p{

    margin-top:9px;

    color:#f5d36a;

    font-size:clamp(13px,2vw,18px);

    font-weight:700;

    letter-spacing:3px;

}


#examTitle{

    margin-top:15px !important;

    font-size:clamp(22px,4vw,35px) !important;

    color:#fff !important;

    font-weight:800 !important;

    text-shadow:

    0 3px 16px rgba(0,0,0,.75) !important;

}


#sessionTitle{

    margin-top:5px !important;

    color:rgba(255,255,255,.9) !important;

    font-size:15px;

}


/* =====================================================
   LIVE STATUS
===================================================== */

.live{

    display:inline-flex;

    align-items:center;

    gap:9px;

    margin-top:14px;

    padding:9px 22px;

    border-radius:50px;

    color:#fff;

    font-size:13px;

    font-weight:800;

    background:

    linear-gradient(
        180deg,
        #34d399,
        #119669
    );

    border:1px solid rgba(255,255,255,.55);

    box-shadow:

    inset 0 2px 2px rgba(255,255,255,.4),

    0 9px 25px rgba(16,185,129,.40);

}


.live::before{

    content:"";

    width:9px;

    height:9px;

    border-radius:50%;

    background:#fff;

    box-shadow:

    0 0 0 5px rgba(255,255,255,.18);

}


/* =====================================================
   PREMIUM RESULT SEARCH
===================================================== */

.search-card{

    width:min(100%,570px);

    margin:22px auto 0;

    padding:26px;

    border-radius:30px;

    background:

    linear-gradient(
        145deg,
        rgba(255,255,255,.97),
        rgba(239,245,255,.88)
    );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:

    0 30px 65px rgba(0,20,60,.30),

    inset 0 1px 0 #fff;

    position:relative;

}


.search-card::before{

    content:"";

    position:absolute;

    inset:1px;

    border-radius:29px;

    pointer-events:none;

    background:

    linear-gradient(
        120deg,
        rgba(255,255,255,.9),
        transparent 45%,
        rgba(212,175,55,.10)
    );

}


.search-title{

    position:relative;

    color:#102b61;

    font-size:22px;

    font-weight:800;

    margin-bottom:18px;

}


.search-title i{

    color:#d3a72e;

}


/* =====================================================
   INPUTS
===================================================== */

.input-box{

    width:100%;

    padding:16px 17px;

    margin-bottom:14px;

    border:1px solid #dce5f4;

    border-radius:16px;

    outline:none;

    background:#fff;

    color:#172b52;

    font-size:15px;

    font-weight:500;

    box-shadow:

    inset 0 2px 5px rgba(12,42,90,.06),

    0 5px 15px rgba(12,42,90,.06);

    transition:.25s;

}


.input-box:focus{

    border-color:#2875e3;

    box-shadow:

    0 0 0 4px rgba(37,99,235,.10),

    inset 0 2px 5px rgba(12,42,90,.04);

}


/* =====================================================
   PREMIUM 3D BUTTON
===================================================== */

.result-btn,
.login-btn{

    position:relative;

    width:100%;

    border:none;

    border-radius:15px;

    color:#fff;

    cursor:pointer;

    font-weight:800;

    letter-spacing:1px;

    background:

    linear-gradient(
        180deg,
        #3b8cff 0%,
        #0b4bb1 100%
    );

    box-shadow:

    0 6px 0 #07377f,

    0 14px 28px rgba(8,63,155,.32),

    inset 0 1px 1px rgba(255,255,255,.45);

    transition:.15s ease;

}


.result-btn{

    padding:16px;

    font-size:16px;

}


.result-btn:hover,
.login-btn:hover{

    transform:translateY(-3px);

    filter:brightness(1.06);

}


.result-btn:active,
.login-btn:active{

    transform:translateY(4px);

    box-shadow:

    0 2px 0 #07377f,

    0 7px 14px rgba(8,63,155,.25);

}


/* =====================================================
   MAIN
===================================================== */

.main-wrap{

    position:relative;

    z-index:5;

    margin-top:-15px;

    padding-bottom:20px;

}


/* =====================================================
   LOGIN CARDS
===================================================== */

.login-container{

    width:min(1100px,94%);

    margin:0 auto;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:20px;

}


.login-card{

    position:relative;

    overflow:hidden;

    min-height:205px;

    padding:25px 20px 22px;

    text-align:center;

    border-radius:25px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #eef4ff
    );

    border:1px solid rgba(255,255,255,.95);

    box-shadow:

    0 17px 38px rgba(13,43,90,.14),

    inset 0 1px 0 #fff;

    transition:.28s ease;

}


.login-card::before{

    content:"";

    position:absolute;

    left:-30px;

    top:-30px;

    width:110px;

    height:110px;

    border-radius:50%;

    background:

    rgba(37,99,235,.08);

}


.login-card:hover{

    transform:translateY(-9px);

    box-shadow:

    0 27px 48px rgba(13,43,90,.20);

}


.login-card i{

    position:relative;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:67px;

    height:67px;

    border-radius:19px;

    color:#fff;

    font-size:29px;

    background:

    linear-gradient(
        145deg,
        #3b8cff,
        #0b3d91
    );

    box-shadow:

    0 6px 0 #072e6d,

    0 13px 24px rgba(11,61,145,.30);

}


.login-card h3{

    margin-top:16px;

    color:#102b61;

    font-size:19px;

    font-weight:800;

}


.login-btn{

    display:block;

    text-decoration:none;

    padding:12px;

    margin-top:15px;

    font-size:14px;

}


/* =====================================================
   ANNOUNCEMENT
===================================================== */

.notice-section{

    width:min(1050px,94%);

    margin:28px auto 0;

    padding:23px;

    border-radius:25px;

    background:#fff;

    border:1px solid #e1e9f6;

    box-shadow:

    0 15px 38px rgba(13,43,90,.11);

}


.notice-section h2{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:9px;

    color:#102b61;

    font-size:21px;

    font-weight:800;

    margin-bottom:14px;

}


.notice-section marquee{

    padding:14px;

    border-radius:14px;

    color:#b32727;

    background:#fff7f7;

    border:1px solid #f3d5d5;

    font-size:14px;

    font-weight:600;

}


#countdown{

    margin-top:15px;

    font-size:15px !important;

    font-weight:700;

    color:#0b3d91;

    text-align:center;

}


/* =====================================================
   RESULT DISPLAY
===================================================== */

#result:empty{

    display:none;

}


.result-card{

    width:min(1050px,94%);

    margin:25px auto;

    padding:28px;

    border-radius:30px;

    background:

    linear-gradient(
        145deg,
        #ffffff,
        #f5f9ff
    );

    border:1px solid #dfe8f7;

    box-shadow:

    0 22px 55px rgba(13,43,90,.17);

}


.result-header{

    text-align:center;

    margin-bottom:20px;

}


.result-header h2{

    color:#0b3d91;

    font-weight:900;

}


.info-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:13px;

    margin:20px 0;

}


.info-box{

    padding:15px;

    border-radius:15px;

    background:#eef4ff;

    color:#19376e;

    font-weight:700;

    text-align:center;

}


.resultTable{

    width:100%;

    border-collapse:separate;

    border-spacing:0;

    margin-top:20px;

    overflow:hidden;

}


.resultTable th{

    background:#0b3d91;

    color:#fff;

    padding:13px;

}


.resultTable td{

    padding:11px;

    border-bottom:1px solid #e5eaf2;

    text-align:center;

}


.summary{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(120px,1fr));

    gap:13px;

    margin-top:20px;

}


.summary div{

    padding:16px;

    border-radius:15px;

    text-align:center;

    background:#edf4ff;

    font-weight:700;

}


.pass{

    background:#dff6e7 !important;

    color:#11733e;

}


.fail{

    background:#fde4e5 !important;

    color:#b4232c;

}


.result-card button{

    width:100%;

    padding:15px;

    margin-top:20px;

    border:none;

    border-radius:15px;

    background:#0b3d91;

    color:#fff;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:30px;

    padding:18px 15px;

    text-align:center;

    color:#fff;

    background:

    linear-gradient(
        135deg,
        #061b43,
        #0b3d91
    );

    border-top:2px solid #d9b43b;

}


.footer .developer{

    margin:0;

    font-size:14px;

    font-weight:600;

}


.footer strong{

    color:#f5d36a;

}


/* =====================================================
   TOP BUTTON
===================================================== */

#topBtn{

    display:none;

    position:fixed;

    right:18px;

    bottom:20px;

    width:53px;

    height:53px;

    border:none;

    border-radius:50%;

    color:#fff;

    background:

    linear-gradient(
        145deg,
        #2476df,
        #0b3d91
    );

    font-size:21px;

    cursor:pointer;

    box-shadow:

    0 6px 0 #062e6b,

    0 12px 24px rgba(11,61,145,.35);

    z-index:999;

}


/* =====================================================
   WHATSAPP
===================================================== */

.whatsapp-btn{

    position:fixed;

    right:18px;

    bottom:83px;

    width:58px;

    height:58px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff;

    background:#25D366;

    text-decoration:none;

    font-size:27px;

    box-shadow:

    0 6px 0 #169b49,

    0 12px 24px rgba(37,211,102,.35);

    z-index:999;

    transition:.2s;

}


.whatsapp-btn:hover{

    transform:translateY(-3px);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:720px){

    .hero{

        min-height:625px;

        padding-top:22px;

    }


    .logo{

        width:94px;

        height:94px;

    }


    .hero h1{

        letter-spacing:1px;

    }


    .hero p{

        letter-spacing:2px;

    }


    .search-card{

        padding:20px;

        border-radius:24px;

    }


    .search-title{

        font-size:20px;

    }


    .login-container{

        width:90%;

        grid-template-columns:1fr;

        gap:14px;

    }


    .login-card{

        min-height:auto;

        padding:21px;

    }


    .login-btn{

        max-width:280px;

        margin:14px auto 0;

    }


    .notice-section{

        padding:18px;

    }


    .notice-section h2{

        font-size:18px;

    }


    .result-card{

        padding:18px;

    }

}


/* =====================================================
   SAFE AREA
===================================================== */

@supports(padding:env(safe-area-inset-top)){

    body{

        padding-top:env(safe-area-inset-top);

        padding-bottom:env(safe-area-inset-bottom);

    }

}

</style>

</head>

<!-- =====================================================
     TOP BUTTON SCRIPT
===================================================== -->

<script>

const topBtn =
document.getElementById("topBtn");


window.onscroll=function(){

    if(
        document.body.scrollTop > 200 ||
        document.documentElement.scrollTop > 200
    ){

        topBtn.style.display="flex";

    }else{

        topBtn.style.display="none";

    }

};

</script>


<!-- =====================================================
     FIREBASE / APP
===================================================== -->

<script
type="module"
src="app.js">
</script>


<!-- =====================================================
     SERVICE WORKER
===================================================== -->

<script>

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator.serviceWorker
            .register("./sw.js")

            .then(function(){

                console.log(
                    "IPSPS Service Worker Registered Successfully"
                );

            })

            .catch(function(error){

                console.error(
                    "IPSPS Service Worker Registration Failed:",
                    error
                );

            });

        }
    );

}

</script>
