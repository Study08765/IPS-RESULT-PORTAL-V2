<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#071d49">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>IPSPS PORTAL - IPS PUBLIC SCHOOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

/* ================= GLOBAL ================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f3f7ff;
    color:#10234f;
    overflow-x:hidden;
}


/* ================= CLEAN IMAGE ================= */

.hero-image{

    height:220px;

    width:100%;

    overflow:hidden;

    background:#eaf0f8;
}

.hero-image img{

    width:100%;

    height:100%;

    display:block;

    object-fit:cover;

    object-position:center;

    filter:
    brightness(1.08)
    saturate(.92)
    contrast(.96);
}


/* ================= COMBINED PREMIUM CARD ================= */

.school-result-card{

    width:min(900px,94%);

    margin:-18px auto 0;

    position:relative;

    z-index:5;

    padding:20px 24px 23px;

    border-radius:28px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #edf4ff
    );

    border:1px solid #ffffff;

    box-shadow:

    0 20px 48px rgba(10,40,90,.17),

    inset 0 1px 0 #ffffff;

    overflow:hidden;
}


.school-result-card::before{

    content:"";

    position:absolute;

    width:210px;

    height:210px;

    border-radius:50%;

    right:-110px;

    top:-125px;

    background:
    rgba(37,99,235,.07);
}


.school-result-card::after{

    content:"";

    position:absolute;

    width:170px;

    height:170px;

    border-radius:50%;

    left:-100px;

    bottom:-120px;

    background:
    rgba(212,175,55,.07);
}


/* ================= GOLD LINE ================= */

.gold-line,
.result-gold{

    height:3px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #b98c1c,
        #f4d56a,
        #b98c1c
    );
}


.gold-line{

    width:72px;

    margin:0 auto 9px;
}


/* ================= LOGO ================= */

.logo{

    position:relative;

    z-index:2;

    width:66px;

    height:66px;

    margin:0 auto 7px;

    padding:5px;

    border-radius:50%;

    background:#fff;

    border:2px solid #e4bc40;

    box-shadow:

    0 0 0 5px rgba(255,215,0,.10),

    0 9px 22px rgba(10,40,90,.18);
}


.logo img{

    width:100%;

    height:100%;

    object-fit:contain;

    border-radius:50%;
}


/* ================= SCHOOL NAME ================= */

.school-name{

    position:relative;

    z-index:2;

    text-align:center;

    color:#0b3d91;

    font-size:
    clamp(27px,5vw,43px);

    line-height:1;

    font-weight:900;

    letter-spacing:1px;
}


.school-place{

    position:relative;

    z-index:2;

    text-align:center;

    margin-top:4px;

    color:#b58a1d;

    font-size:11px;

    font-weight:800;

    letter-spacing:2px;
}


/* ================= EXAM ================= */

#examTitle{

    position:relative;

    z-index:2;

    margin-top:8px !important;

    text-align:center;

    color:#162e61 !important;

    font-size:22px !important;

    line-height:1.1;

    font-weight:900 !important;
}


#sessionTitle{

    position:relative;

    z-index:2;

    margin-top:2px !important;

    text-align:center;

    color:#71809b !important;

    font-size:11px;

    font-weight:600;
}


/* ================= LIVE ================= */

.live{

    position:relative;

    z-index:2;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    width:max-content;

    margin:7px auto 11px;

    padding:6px 15px;

    border-radius:50px;

    color:#fff;

    font-size:10px;

    font-weight:800;

    background:
    linear-gradient(
        180deg,
        #35d59a,
        #109567
    );

    box-shadow:

    inset 0 1px 1px rgba(255,255,255,.4),

    0 7px 15px rgba(16,185,129,.28);
}


.live::before{

    content:"";

    width:6px;

    height:6px;

    border-radius:50%;

    background:#fff;
}


/* ================= RESULT BOX ================= */

.result-box{

    position:relative;

    z-index:2;

    padding:13px 15px 15px;

    border-radius:20px;

    background:
    linear-gradient(
        145deg,
        #fbfdff,
        #edf4ff
    );

    border:1px solid #e0e8f5;

    box-shadow:

    inset 0 1px 0 #fff,

    0 8px 20px rgba(13,43,90,.08);
}


.result-gold{

    width:55px;

    margin:0 auto 6px;
}


.result-title{

    text-align:center;

    color:#0b3d91;

    font-size:20px;

    line-height:1.1;

    font-weight:900;
}


.result-subtitle{

    text-align:center;

    color:#74829b;

    font-size:10px;

    margin:3px 0 10px;
}


/* ================= FORM ================= */

.result-form{

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:12px;
}


.result-field label{

    display:block;

    margin-bottom:4px;

    color:#19376e;

    font-size:10px;

    font-weight:800;
}


.result-field label i{

    color:#c49a25;

    margin-right:3px;
}


.result-input{

    width:100%;

    height:43px;

    padding:0 12px;

    border:1px solid #d9e3f2;

    border-radius:11px;

    outline:none;

    background:#fff;

    color:#172b52;

    font-size:11px;

    font-weight:500;

    box-shadow:
    inset 0 2px 5px rgba(10,40,90,.045);
}


.result-input:focus{

    border-color:#2875df;

    box-shadow:
    0 0 0 3px rgba(37,99,235,.09);
}


/* ================= 3D RESULT BUTTON ================= */

.view-result-btn{

    width:100%;

    height:43px;

    margin-top:10px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    color:#fff;

    font-size:12px;

    font-weight:800;

    letter-spacing:1px;

    background:
    linear-gradient(
        180deg,
        #4197ff,
        #1261ca 50%,
        #0a3f91
    );

    box-shadow:

    0 5px 0 #062e70,

    0 10px 20px rgba(11,61,145,.27),

    inset 0 1px 1px rgba(255,255,255,.45);

    transition:.15s;
}


.view-result-btn:hover{

    transform:translateY(-2px);

    filter:brightness(1.05);
}


.view-result-btn:active{

    transform:translateY(3px);

    box-shadow:

    0 2px 0 #062e70,

    0 5px 10px rgba(11,61,145,.22);
}


/* ================= LOGIN ================= */

.login-container{

    width:min(900px,94%);

    margin:10px auto 0;

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:10px;
}


.login-card{

    padding:10px 9px 11px;

    text-align:center;

    border-radius:17px;

    background:
    linear-gradient(
        145deg,
        #fff,
        #f0f5ff
    );

    border:1px solid #e3eaf5;

    box-shadow:

    0 8px 18px rgba(13,43,90,.10),

    inset 0 1px 0 #fff;
}


.login-card i{

    display:flex;

    align-items:center;

    justify-content:center;

    width:39px;

    height:39px;

    margin:0 auto 6px;

    border-radius:11px;

    color:#fff;

    font-size:17px;

    background:
    linear-gradient(
        145deg,
        #3c8dff,
        #0b3d91
    );

    box-shadow:
    0 3px 0 #072e6d;
}


.login-card h3{

    color:#102b61;

    font-size:11px;

    font-weight:800;
}


.login-btn{

    display:block;

    text-decoration:none;

    margin-top:7px;

    padding:7px 5px;

    border-radius:9px;

    color:#fff;

    font-size:9px;

    font-weight:800;

    background:
    linear-gradient(
        180deg,
        #3b8cff,
        #0b3d91
    );

    box-shadow:
    0 3px 0 #062e70;
}


/* ================= ANNOUNCEMENT ================= */

.notice-section{

    width:min(900px,94%);

    margin:10px auto 0;

    padding:10px 12px;

    border-radius:17px;

    background:#fff;

    border:1px solid #e1e8f4;

    box-shadow:
    0 8px 18px rgba(13,43,90,.08);
}


.notice-section h2{

    text-align:center;

    color:#102b61;

    font-size:13px;

    margin-bottom:6px;

    font-weight:800;
}


.notice-section marquee{

    display:block;

    padding:7px 9px;

    border-radius:9px;

    color:#a92727;

    background:#fff7f7;

    border:1px solid #f2d7d7;

    font-size:9px;

    line-height:1.3;

    font-weight:600;
}


#countdown{

    margin-top:3px !important;

    font-size:9px !important;

    color:#0b3d91;
}


/* ================= RESULT OUTPUT ================= */

#result:empty{

    display:none;
}


.result-card{

    width:min(900px,94%);

    margin:12px auto;

    padding:20px;

    border-radius:22px;

    background:#fff;

    box-shadow:
    0 15px 35px rgba(13,43,90,.15);
}


/* ================= FOOTER ================= */

.footer{

    margin-top:10px;

    padding:7px 10px;

    text-align:center;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #061b43,
        #0b3d91
    );

    border-top:2px solid #d9b43b;
}


.footer .developer{

    margin:0;

    font-size:9px;

    font-weight:600;
}


.footer strong{

    color:#f5d36a;
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .hero-image{

        height:185px;
    }


    .school-result-card{

        width:94%;

        margin:-15px auto 0;

        padding:16px 13px 17px;

        border-radius:23px;
    }


    .logo{

        width:57px;

        height:57px;

        margin-bottom:6px;
    }


    .school-name{

        font-size:26px;
    }


    .school-place{

        font-size:9px;

        letter-spacing:1.7px;
    }


    #examTitle{

        font-size:19px !important;

        margin-top:6px !important;
    }


    #sessionTitle{

        font-size:10px;
    }


    .live{

        margin-top:5px;

        margin-bottom:8px;

        padding:5px 14px;

        font-size:9px;
    }


    .result-box{

        padding:11px;

        border-radius:18px;
    }


    .result-title{

        font-size:18px;
    }


    .result-subtitle{

        font-size:9px;

        margin-bottom:8px;
    }


    .result-form{

        gap:8px;
    }


    .result-field label{

        font-size:9px;
    }


    .result-input{

        height:39px;

        font-size:10px;
    }


    .view-result-btn{

        height:40px;

        font-size:10px;

        margin-top:8px;
    }


    .login-container{

        width:94%;

        gap:7px;

        margin-top:8px;
    }


    .login-card{

        padding:7px 5px 8px;

        border-radius:13px;
    }


    .login-card i{

        width:32px;

        height:32px;

        font-size:14px;

        margin-bottom:4px;
    }


    .login-card h3{

        font-size:9px;
    }


    .login-btn{

        padding:5px 3px;

        font-size:8px;

        margin-top:5px;
    }


    .notice-section{

        width:94%;

        margin-top:8px;

        padding:8px 9px;

        border-radius:14px;
    }


    .notice-section h2{

        font-size:11px;

        margin-bottom:4px;
    }


    .notice-section marquee{

        font-size:8px;

        padding:6px;
    }


    .footer{

        margin-top:8px;

        padding:6px;
    }


    .footer .developer{

        font-size:8px;
    }

}


/* ================= SHORT MOBILE SCREEN ================= */

@media(max-width:600px) and (max-height:700px){

    .hero-image{

        height:155px;
    }


    .school-result-card{

        padding:12px 11px 13px;
    }


    .logo{

        width:48px;

        height:48px;
    }


    .school-name{

        font-size:22px;
    }


    #examTitle{

        font-size:16px !important;
    }


    .result-box{

        padding:8px 9px 10px;
    }


    .result-title{

        font-size:15px;
    }


    .result-input{

        height:34px;
    }


    .view-result-btn{

        height:35px;
    }


    .login-container{

        margin-top:6px;
    }


    .notice-section{

        margin-top:6px;
    }


    .footer{

        margin-top:6px;
    }

}


/* ================= VERY SMALL ================= */

@media(max-width:380px){

    .hero-image{

        height:165px;
    }


    .school-name{

        font-size:21px;
    }


    .school-result-card{

        padding:12px 9px 13px;
    }


    .result-form{

        gap:6px;
    }


    .login-card h3{

        font-size:8px;
    }

}

</style>

</head>


<body>


<!-- ================= IMAGE ================= -->

<section class="hero-image">

<img
src="hero-bg.jpg"
alt="IPS PUBLIC SCHOOL">

</section>


<!-- ================= COMBINED SCHOOL + RESULT ================= -->

<section class="school-result-card">


<div class="gold-line"></div>


<div class="logo">

<img
src="logo.png"
alt="IPS PUBLIC SCHOOL Logo">

</div>


<h1 class="school-name">

IPS PUBLIC SCHOOL

</h1>


<p class="school-place">

AHIRORI • HARDOI

</p>


<h2 id="examTitle">

Loading...

</h2>


<h3 id="sessionTitle">

Loading...

</h3>


<div
class="live"
id="resultLive">

Loading...

</div>


<!-- ================= RESULT ================= -->

<div class="result-box">


<div class="result-gold"></div>


<h2 class="result-title">

🏆 SEARCH YOUR RESULT

</h2>


<p class="result-subtitle">

Enter your class and roll number

</p>


<div class="result-form">


<div class="result-field">


<label>

<i class="fa-solid fa-graduation-cap"></i>

Select Class

</label>


<select
class="result-input"
id="class">


<option selected disabled>

Select Class

</option>


<option>
Class 3
</option>

<option>
Class 4
</option>

<option>
Class 5
</option>

<option>
Class 6
</option>

<option>
Class 7
</option>

<option>
Class 8
</option>


</select>


</div>


<div class="result-field">


<label>

<i class="fa-solid fa-hashtag"></i>

Roll Number

</label>


<input
type="number"
id="roll"
class="result-input"
placeholder="Enter Roll Number">


</div>


</div>


<button
class="view-result-btn"
onclick="searchResult()">

<i class="fa-solid fa-magnifying-glass"></i>

&nbsp;

VIEW RESULT

</button>


</div>


</section>


<!-- ================= RESULT OUTPUT ================= -->

<div id="result"></div>


<!-- ================= LOGIN ================= -->

<div class="login-container">


<div class="login-card">

<i class="fa-solid fa-user-graduate"></i>

<h3>
Student Login
</h3>

<a
href="student-login.html"
class="login-btn">

LOGIN

</a>

</div>


<div class="login-card">

<i class="fa-solid fa-chalkboard-user"></i>

<h3>
Staff Login
</h3>

<a
href="staff-login.html"
class="login-btn">

LOGIN

</a>

</div>


<div class="login-card">

<i class="fa-solid fa-user-shield"></i>

<h3>
Admin Login
</h3>

<a
href="login.html"
class="login-btn">

LOGIN

</a>

</div>


</div>


<!-- ================= ANNOUNCEMENTS ================= -->

<section
class="notice-section"
id="noticeBox">


<h2>

📢 Latest Announcements

</h2>


<marquee
id="noticeTextShow"
behavior="scroll"
direction="left">

Loading...

</marquee>


<div
id="countdown">

</div>


</section>


<!-- ================= FOOTER ================= -->

<footer class="footer">


<p class="developer">

Developed &amp; Designed by

<strong>
A.K. SINGH CHANDEL
</strong>

</p>


</footer>


<!-- ================= APP ================= -->

<script
type="module"
src="app.js">
</script>


<!-- ================= SERVICE WORKER ================= -->

<script>

if("serviceWorker" in navigator){

    window.addEventListener(
        "load",
        function(){

            navigator
            .serviceWorker
            .register("./sw.js")

            .then(function(){

                console.log(
                    "IPSPS Service Worker Registered Successfully"
                );

            })

            .catch(function(error){

                console.error(
                    "IPSPS Service Worker Registration Failed:",
                    error
                );

            });

        }
    );

}

</script>


</body>

  </html>
