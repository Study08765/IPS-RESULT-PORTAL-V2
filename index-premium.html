<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b3d91">

<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>IPSPS PORTAL - IPS PUBLIC SCHOOL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>

/* =====================================================
GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:
    radial-gradient(
        circle at 10% 10%,
        rgba(46,111,207,.08),
        transparent 28%
    ),
    radial-gradient(
        circle at 90% 60%,
        rgba(213,174,62,.06),
        transparent 25%
    ),
    #f1f5fa;

    color:#16315f;
    overflow-x:hidden;
}


/* =====================================================
FULL IMAGE
===================================================== */

.hero-image{
    width:100%;
    margin:0;
    padding:0;
    line-height:0;
    overflow:hidden;
    background:#eaf0f7;
}

.hero-image img{
    width:100%;
    height:auto;
    display:block;
    object-fit:contain;
    object-position:center;
    filter:
    brightness(1.05)
    saturate(.95)
    contrast(.97);
}


/* =====================================================
MAIN CONTAINER
===================================================== */

.main-container{
    width:min(1080px,94%);
    margin:0 auto;
}


/* =====================================================
PREMIUM BRANDING CARD
===================================================== */

.school-card{

    position:relative;

    padding:
    27px
    30px
    31px;

    background:
    linear-gradient(
        145deg,
        #ffffff 0%,
        #f5f9ff 52%,
        #eaf2fc 100%
    );

    border:
    1px solid #dce6f3;

    border-radius:
    0 0 30px 30px;

    box-shadow:
    0 22px 55px rgba(19,50,91,.14),

    inset 0 1px 0 #ffffff;

    overflow:hidden;
}


.school-card::before{

    content:"";

    position:absolute;

    width:320px;
    height:320px;

    right:-190px;
    top:-190px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(52,111,203,.10),
        transparent 68%
    );
}


.school-card::after{

    content:"";

    position:absolute;

    width:260px;
    height:260px;

    left:-180px;
    bottom:-180px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.08),
        transparent 70%
    );
}


/* =====================================================
GOLD DECORATION
===================================================== */

.luxury-line{

    position:relative;
    z-index:2;

    width:90px;
    height:3px;

    margin:0 auto 14px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #b58920,
        #f3d46d,
        #b58920
    );
}


/* =====================================================
LOGO
===================================================== */

.logo{

    position:relative;
    z-index:2;

    width:92px;
    height:92px;

    margin:0 auto 11px;

    padding:6px;

    border-radius:50%;

    background:#fff;

    border:
    3px solid #d8b43e;

    box-shadow:
    0 0 0 6px rgba(213,176,58,.08),
    0 13px 30px rgba(20,55,100,.18);
}

.logo img{

    width:100%;
    height:100%;

    object-fit:contain;

    border-radius:50%;
}


/* =====================================================
SCHOOL NAME
===================================================== */

.school-name{

    position:relative;
    z-index:2;

    text-align:center;

    color:#0b3d91;

    font-size:
    clamp(28px,5vw,49px);

    line-height:1;

    font-weight:900;

    letter-spacing:1.4px;

    text-shadow:
    0 3px 10px rgba(11,61,145,.10);
}


.school-place{

    position:relative;
    z-index:2;

    text-align:center;

    margin-top:7px;

    color:#ad821b;

    font-size:11px;

    font-weight:800;

    letter-spacing:3px;
}


/* =====================================================
DIVIDER
===================================================== */

.school-divider{

    position:relative;
    z-index:2;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:10px;

    margin:14px auto 12px;
}

.school-divider span{

    width:70px;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #c7a13b
    );
}

.school-divider span:last-child{

    background:
    linear-gradient(
        90deg,
        #c7a13b,
        transparent
    );
}

.school-divider i{

    color:#c39b2d;

    font-size:8px;
}


/* =====================================================
UNIT TEST / SESSION
===================================================== */

#examTitle{

    position:relative;
    z-index:2;

    margin-top:0 !important;

    text-align:center;

    color:#123a78 !important;

    font-size:
    clamp(21px,4vw,29px) !important;

    font-weight:900 !important;

    line-height:1.15;

    text-shadow:none !important;
}

#sessionTitle{

    position:relative;
    z-index:2;

    margin-top:5px !important;

    text-align:center;

    color:#73839c !important;

    font-size:13px;

    font-weight:600;
}


/* =====================================================
LIVE
===================================================== */

.live{

    position:relative;
    z-index:2;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    width:max-content;

    margin:11px auto 20px;

    padding:8px 19px;

    border-radius:50px;

    color:#fff;

    background:
    linear-gradient(
        180deg,
        #36c992,
        #11885e
    );

    border:
    1px solid #8ee3c2;

    font-size:10px;

    font-weight:800;

    box-shadow:
    0 8px 20px rgba(17,136,94,.20),
    inset 0 1px 1px rgba(255,255,255,.4);
}

.live::before{

    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:
    0 0 0 4px rgba(255,255,255,.16);
}


/* =====================================================
RESULT SECTION
===================================================== */

.result-panel{

    position:relative;
    z-index:2;

    padding:
    28px
    30px
    31px;

    border-radius:27px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #edf4fc
    );

    border:
    1px solid #d5e1ef;

    box-shadow:
    0 20px 45px rgba(17,52,91,.12),
    inset 0 1px 0 #ffffff;

    overflow:hidden;
}


.result-panel::before{

    content:"";

    position:absolute;

    width:210px;
    height:210px;

    right:-110px;
    top:-110px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(211,174,57,.10),
        transparent 68%
    );
}


.result-heading-line{

    position:relative;
    z-index:2;

    width:70px;
    height:4px;

    margin:0 auto 10px;

    border-radius:20px;

    background:
    linear-gradient(
        90deg,
        #b4871d,
        #f1d36b,
        #b4871d
    );
}


/* =====================================================
UNIT TEST HEADING INSIDE RESULT
===================================================== */

.result-title{

    position:relative;
    z-index:2;

    text-align:center;

    color:#0b3d91;

    font-size:
    clamp(25px,4vw,33px);

    font-weight:900;

    letter-spacing:.4px;
}


.result-subtitle{

    position:relative;
    z-index:2;

    text-align:center;

    color:#77869d;

    font-size:13px;

    margin-top:4px;

    margin-bottom:22px;
}


/* =====================================================
FIELDS
===================================================== */

.result-form{

    position:relative;
    z-index:2;

    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:18px;
}


.field label{

    display:block;

    color:#183a70;

    font-size:11px;

    font-weight:800;

    margin-bottom:7px;
}


.field label i{

    color:#b78b21;

    margin-right:4px;
}


.result-input{

    width:100%;

    height:56px;

    padding:0 16px;

    border-radius:13px;

    border:
    1px solid #d2deec;

    outline:none;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f4f7fb
    );

    color:#18315b;

    font-size:13px;

    box-shadow:
    inset 0 2px 6px rgba(10,40,90,.04),
    0 5px 15px rgba(10,40,90,.04);

    transition:.25s;
}


.result-input:focus{

    border-color:#2c72ce;

    box-shadow:
    0 0 0 4px rgba(37,99,235,.08),
    0 8px 20px rgba(20,70,130,.08);
}


/* =====================================================
PREMIUM RESULT BUTTON
===================================================== */

.view-result-btn{

    position:relative;
    z-index:2;

    width:100%;

    height:63px;

    margin-top:21px;

    border:1px solid #7ea7dc;

    border-radius:15px;

    cursor:pointer;

    color:#fff;

    font-size:15px;

    font-weight:900;

    letter-spacing:1.5px;

    background:
    linear-gradient(
        180deg,
        #4d93e8 0%,
        #1c61b6 48%,
        #0b3d91 100%
    );

    box-shadow:
    0 7px 0 #062d68,
    0 17px 32px rgba(11,61,145,.28),
    inset 0 2px 2px rgba(255,255,255,.42);

    transition:.15s;

    overflow:hidden;
}


.view-result-btn::before{

    content:"";

    position:absolute;

    left:10%;
    right:10%;

    top:5px;

    height:1px;

    background:
    rgba(255,255,255,.42);
}


.view-result-btn::after{

    content:"";

    position:absolute;

    top:0;
    left:-80%;

    width:55%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.20),
        transparent
    );

    transform:skewX(-20deg);

    transition:.7s;
}


.view-result-btn:hover::after{

    left:130%;
}


.view-result-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 10px 0 #062d68,
    0 22px 38px rgba(11,61,145,.32),
    inset 0 2px 2px rgba(255,255,255,.45);
}


.view-result-btn:active{

    transform:translateY(5px);

    box-shadow:
    0 2px 0 #062d68,
    0 8px 15px rgba(11,61,145,.20);
}


/* =====================================================
RESULT OUTPUT
===================================================== */

#result:empty{
    display:none;
}

.result-card{

    width:100%;

    margin-top:20px;

    padding:26px;

    border-radius:25px;

    background:#fff;

    border:1px solid #dce6f2;

    box-shadow:
    0 18px 40px rgba(10,40,90,.12);
}


/* =====================================================
LOGIN
===================================================== */

.login-container{

    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:17px;

    margin-top:20px;
}


.login-card{

    position:relative;

    padding:
    21px
    16px
    22px;

    text-align:center;

    border-radius:21px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #edf4fb
    );

    border:
    1px solid #d9e4f1;

    box-shadow:
    0 14px 30px rgba(13,46,83,.10),
    inset 0 1px 0 #fff;

    transition:.3s;

    overflow:hidden;
}


.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:3px;

    background:
    linear-gradient(
        90deg,
        #b58a20,
        #efd36b,
        #b58a20
    );
}


.login-card:hover{

    transform:translateY(-6px);

    box-shadow:
    0 23px 40px rgba(13,46,83,.16);
}


.login-icon{

    width:58px;
    height:58px;

    margin:0 auto 11px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:17px;

    color:#fff;

    font-size:23px;

    background:
    linear-gradient(
        145deg,
        #4a91e7,
        #0b3d91
    );

    border:1px solid #8bb2e3;

    box-shadow:
    0 5px 0 #062d68,
    0 10px 22px rgba(11,61,145,.20);
}


.login-card h3{

    color:#12366e;

    font-size:15px;

    font-weight:800;
}


.login-card p{

    color:#8391a7;

    font-size:9px;

    margin-top:3px;
}


/* =====================================================
3D LOGIN BUTTON
===================================================== */

.login-btn{

    position:relative;

    display:block;

    margin-top:12px;

    padding:11px 8px;

    text-decoration:none;

    text-align:center;

    color:#fff;

    border:
    1px solid #82a9d8;

    border-radius:10px;

    font-size:10px;

    font-weight:900;

    letter-spacing:.6px;

    background:
    linear-gradient(
        180deg,
        #4d94e9,
        #185cad 55%,
        #0b3d91
    );

    box-shadow:
    0 4px 0 #062d68,
    0 9px 17px rgba(11,61,145,.20),
    inset 0 1px 1px rgba(255,255,255,.35);

    transition:.15s;
}


.login-btn:hover{

    transform:translateY(-2px);

    filter:brightness(1.05);

    box-shadow:
    0 6px 0 #062d68,
    0 13px 22px rgba(11,61,145,.24);
}


.login-btn:active{

    transform:translateY(3px);

    box-shadow:
    0 1px 0 #062d68,
    0 5px 10px rgba(11,61,145,.18);
}


/* =====================================================
ANNOUNCEMENT
===================================================== */

.notice-section{

    margin-top:20px;

    padding:19px;

    border-radius:22px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #edf4fb
    );

    border:
    1px solid #d9e4f0;

    box-shadow:
    0 15px 32px rgba(13,46,83,.09);
}


.notice-title-wrap{

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    margin-bottom:11px;
}


.notice-title-wrap::before,
.notice-title-wrap::after{

    content:"";

    width:55px;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #c49a2d
    );
}


.notice-title-wrap::after{

    background:
    linear-gradient(
        90deg,
        #c49a2d,
        transparent
    );
}


.notice-title{

    color:#12386f;

    font-size:15px;

    font-weight:900;

    letter-spacing:.5px;
}


.notice-inner{

    padding:9px;

    border-radius:12px;

    background:
    linear-gradient(
        145deg,
        #f9fbfe,
        #edf3f9
    );

    border:
    1px solid #d8e3ef;
}


.notice-inner marquee{

    display:block;

    padding:10px;

    border-radius:8px;

    background:#fff;

    border:
    1px solid #e2d5a9;

    color:#9b2b2b;

    font-size:10px;

    font-weight:600;
}


#countdown{

    margin-top:8px !important;

    text-align:center;

    color:#0b3d91;

    font-size:10px !important;

    font-weight:700;
}


/* =====================================================
FOOTER
===================================================== */

.footer{

    margin-top:24px;

    padding:14px 10px;

    text-align:center;

    color:#fff;

    background:
    linear-gradient(
        135deg,
        #0b3d91,
        #082f70
    );

    border-top:
    2px solid #d5b143;
}


.footer .developer{

    margin:0;

    font-size:10px;

    font-weight:600;
}


.footer strong{

    color:#f4d56d;
}


/* =====================================================
WHATSAPP
===================================================== */

.whatsapp-btn{

    position:fixed;

    right:17px;
    bottom:17px;

    width:53px;
    height:53px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#fff;

    background:#25D366;

    text-decoration:none;

    font-size:25px;

    box-shadow:
    0 5px 0 #159947,
    0 12px 24px rgba(37,211,102,.28);

    z-index:999;
}


/* =====================================================
MOBILE
===================================================== */

@media(max-width:700px){

    .main-container{

        width:100%;

        margin:0;
    }


    .school-card{

        width:100%;

        padding:
        22px 13px 23px;

        border-radius:
        0 0 24px 24px;
    }


    .logo{

        width:76px;
        height:76px;
    }


    .school-name{

        font-size:26px;

        letter-spacing:.7px;
    }


    .school-place{

        font-size:9px;

        letter-spacing:2px;
    }


    .school-divider{

        margin:
        11px auto 9px;
    }


    .school-divider span{

        width:50px;
    }


    #examTitle{

        font-size:19px !important;
    }


    #sessionTitle{

        font-size:10px;
    }


    .live{

        margin:
        8px auto 14px;

        padding:
        7px 15px;

        font-size:9px;
    }


    .result-panel{

        padding:
        22px 13px 23px;

        border-radius:21px;
    }


    .result-title{

        font-size:21px;
    }


    .result-subtitle{

        font-size:9px;

        margin-bottom:16px;
    }


    .result-form{

        grid-template-columns:1fr;

        gap:12px;
    }


    .field label{

        font-size:9px;
    }


    .result-input{

        height:49px;

        font-size:11px;
    }


    .view-result-btn{

        height:58px;

        margin-top:15px;

        font-size:12px;
    }


    .login-container{

        grid-template-columns:
        repeat(3,1fr);

        gap:7px;

        padding:
        0 10px;

        margin-top:14px;
    }


    .login-card{

        padding:
        14px 4px 15px;

        border-radius:15px;
    }


    .login-icon{

        width:41px;
        height:41px;

        border-radius:11px;

        font-size:16px;

        margin-bottom:7px;
    }


    .login-card h3{

        font-size:8px;
    }


    .login-card p{

        display:none;
    }


    .login-btn{

        margin-top:7px;

        padding:8px 2px;

        font-size:7px;
    }


    .notice-section{

        margin:
        14px 10px 0;

        padding:13px;

        border-radius:17px;
    }


    .notice-title{

        font-size:11px;
    }


    .notice-title-wrap::before,
    .notice-title-wrap::after{

        width:25px;
    }


    .notice-inner{

        padding:6px;
    }


    .notice-inner marquee{

        padding:7px;

        font-size:8px;
    }


    .footer{

        margin-top:16px;

        padding:10px;
    }


    .footer .developer{

        font-size:8px;
    }


    .whatsapp-btn{

        width:47px;
        height:47px;

        right:13px;
        bottom:13px;

        font-size:22px;
    }

}


/* =====================================================
VERY SMALL
===================================================== */

@media(max-width:380px){

    .school-name{

        font-size:23px;
    }


    .logo{

        width:65px;
        height:65px;
    }


    #examTitle{

        font-size:17px !important;
    }


    .result-title{

        font-size:19px;
    }


    .view-result-btn{

        height:55px;
    }


    .login-card h3{

        font-size:7px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
IMAGE
===================================================== -->

<section class="hero-image">

<img
src="premium-students.jpg"
alt="IPS PUBLIC SCHOOL Students">

</section>



<!-- =====================================================
MAIN
===================================================== -->

<div class="main-container">


<!-- =====================================================
SCHOOL BRANDING
===================================================== -->

<section class="school-card">


<div class="luxury-line"></div>


<div class="logo">

<img
src="logo.png"
alt="IPS PUBLIC SCHOOL Logo">

</div>


<h1 class="school-name">

IPS PUBLIC SCHOOL

</h1>


<p class="school-place">

AHIRORI • HARDOI

</p>


<div class="school-divider">

<span></span>

<i class="fa-solid fa-diamond"></i>

<span></span>

</div>


<!-- UNIT TEST -->

<h2 id="examTitle">

Loading...

</h2>


<!-- SESSION -->

<h3 id="sessionTitle">

Loading...

</h3>


<!-- LIVE -->

<div
class="live"
id="resultLive">

Loading...

</div>



<!-- =====================================================
RESULT SECTION
===================================================== -->

<div class="result-panel">


<div class="result-heading-line"></div>


<!-- SEARCH YOUR RESULT REMOVED -->

<h2 class="result-title">

UNIT TEST

</h2>


<p class="result-subtitle">

RESULT 2026–27

</p>


<div class="result-form">


<div class="field">

<label>

<i class="fa-solid fa-graduation-cap"></i>

SELECT CLASS

</label>


<select
class="result-input"
id="class">

<option
selected
disabled>

Select Class

</option>

<option>Class 3</option>
<option>Class 4</option>
<option>Class 5</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>

</select>

</div>


<div class="field">

<label>

<i class="fa-solid fa-hashtag"></i>

ROLL NUMBER

</label>


<input
type="number"
id="roll"
class="result-input"
placeholder="Enter Roll Number">

</div>


</div>


<button
class="view-result-btn"
onclick="searchResult()">

<i class="fa-solid fa-magnifying-glass"></i>

&nbsp;&nbsp;

VIEW RESULT

</button>


</div>


</section>



<!-- =====================================================
RESULT OUTPUT
===================================================== -->
