<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPS Student Dashboard V2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
    linear-gradient(rgba(4,25,70,.20), rgba(4,25,70,.25)),
    url("village-bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.header{
    width:100%;
    padding:18px;
    text-align:center;
    background:linear-gradient(90deg,#003b8e,#0066ff);
    color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.30);
}

.header h1{
    font-size:28px;
    font-weight:700;
}

.header p{
    margin-top:6px;
    font-size:15px;
    letter-spacing:2px;
  }
.container{
    width:100%;
    max-width:100%;
    padding:15px;
}

.profile-card{
    width:100%;
    padding:30px 22px;
    margin:20px 0;

    background:transparent; /* Grey हट गया */

    backdrop-filter:none;   /* Blur हट गया */

    border:none;

    border-radius:30px;

    box-shadow:none;
}

.school-logo{
    width:160px;
    height:160px;
    margin:0 auto 2px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    border:5px solid #FFD700;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 25px rgba(255,215,0,.6);
    }

.school-logo img{
    width:100%;
    height:100%;
    object-fit:contain;
}

#name{
    font-size:40px;
    font-weight:900;
    color:#ffffff;
    text-align:center;
    letter-spacing:1px;
    text-shadow:
        0 2px 0 #bdbdbd,
        0 4px 8px rgba(0,0,0,.45),
        0 0 18px rgba(255,255,255,.35);
    margin:8px 0 20px;
}

.student-class{
    color:#fff;
    opacity:.9;
    margin-top:8px;
  }
    .info-card{
    width:94%;
    max-width:500px;
    margin:20px auto;
    padding:18px;
    background:linear-gradient(135deg,
        rgba(8,15,40,.92),
        rgba(20,35,75,.90),
        rgba(8,15,40,.92));
    border:2px solid rgba(255,215,0,.35);
    border-radius:24px;
    backdrop-filter:blur(15px);
    box-shadow:
        0 15px 35px rgba(0,0,0,.45),
        inset 0 1px 3px rgba(255,255,255,.12);
    }

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:12px 0;
    padding:16px 18px;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,.10),
        0 4px 10px rgba(0,0,0,.25);
}

.row span{
    font-size:18px;
    font-weight:700;
    color:#FFD700;
    letter-spacing:.5px;
}

.row b{
    font-size:20px;
    font-weight:800;
    color:#fff;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
}

.btn{
    display:flex;
    align-items:center;
    justify-content:center;

    height:72px;
    padding:0 20px;

    border-radius:22px;
    text-decoration:none;

    font-size:20px;
    font-weight:700;
    color:#fff;

    background:linear-gradient(135deg,#0f172a,#334155);

    border:1.5px solid rgba(255,255,255,.25);

    box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        inset 0 2px 3px rgba(255,255,255,.30);

    transition:.35s ease;
}

.btn:hover{
    transform:translateY(-5px) scale(1.03);

    box-shadow:
        0 18px 35px rgba(0,0,0,.45),
        0 0 18px rgba(30,107,255,.45);
}

.btn:active{
    transform:scale(.98);
    }

.logout{
    grid-column:1/3;

    height:74px;

    background:linear-gradient(135deg,#dc2626,#991b1b);

    font-size:21px;
    font-weight:800;

    border-radius:22px;
    }
    .button-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
    margin-top:600px;
    padding-bottom:30px;
    }

.time-card{
    width:240px;
    height:80px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.30);
    margin:25px auto;
    }
#digitalClock{
    font-size:32px;
    font-weight:700;
    color:#fff;
    letter-spacing:2px;
}

#liveDate{
    display:block;
    font-size:14px;
    color:#FFD700;
    margin-top:4px;
    }
    .top-profile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    }
    .footer{
    width:95%;
    margin:35px auto 20px;
    padding:18px 20px;
    border-radius:18px;
    background:linear-gradient(135deg,#0d47a1,#1565c0,#0d47a1);
    border:2px solid rgba(255,215,0,.5);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
    text-align:center;
    color:#ffd700;
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    text-transform:uppercase;
    text-shadow:0 2px 6px rgba(0,0,0,.5);
    }
    .student-title{
    color:#ffffff;
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    margin-top:8px;
    }
</style>

</head>

<body>
<div class="header">
    <h1>🎓 IPS PUBLIC SCHOOL</h1>
    <p>STUDENT DASHBOARD</p>
</div>

<div class="container">
    <div class="profile-card">

    <div class="top-profile">

    <div class="school-logo">
        <img src="logo.png" id="schoolLogo" alt="IPS Logo">
    </div>

<div class="name-card">
    <div class="student-title">👨‍🎓 STUDENT NAME</div>
    <h2 id="name"></h2>
</div>

<div class="info-card">

    <div class="row">
        <span>👨 Father</span>
        <b id="father"></b>
    </div>

    <div class="row">
        <span>🎓 Class</span>
        <b id="class"></b>
    </div>

    <div class="row">
        <span>🎫 Roll No</span>
        <b id="roll"></b>
    </div>
</div>
    </div>
<div class="button-grid">

<a class="btn" href="student-homework.html">📚 Homework</a>

<a class="btn" href="student-timetable.html">📅 Time Table</a>

<a class="btn" href="student-admitcard.html">🎫 Admit Card</a>

<a class="btn" href="index.html">📊 Result</a>

<a class="btn logout" href="student-login.html">🚪 Logout</a>

</div>
    <div style="display:flex;justify-content:center;">
    <div class="time-card">
        <div id="digitalClock"></div>
        <div id="liveDate"></div>
    </div>
    </div>
    <script>
const digitalClock = document.getElementById("digitalClock");
const liveDate = document.getElementById("liveDate");

function updateClock(){

    const now = new Date();

    digitalClock.innerHTML = now.toLocaleTimeString("en-IN",{
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
    });

    liveDate.innerHTML = now.toLocaleDateString("en-IN",{
        weekday:"short",
        day:"2-digit",
        month:"long",
        year:"numeric"
    });

}

updateClock();
setInterval(updateClock,1000);
        const student = JSON.parse(localStorage.getItem("student"));

if(!student){
    window.location = "student-login.html";
}

document.getElementById("name").innerHTML = student.Name;
document.getElementById("father").innerHTML = student.Father;
document.getElementById("class").innerHTML = student.Class;
document.getElementById("roll").innerHTML = student.Roll;
    </script>
    
    <footer class="footer">
🏫 WELCOME TO IPS PUBLIC SCHOOL 🏫
    </footer>
</body>

</html>
